<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560" role="img">
<title>Series and parallel circuits with their currents and voltages</title>
<rect x="30" y="74" width="350" height="268" rx="12" fill="none" stroke="#374151" stroke-width="2.5"/><text x="30" y="50" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600">Series: one path</text><text x="30" y="67" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4b5563">the current is the same at every point in the loop</text><line x1="92" y1="176" x2="318" y2="176" stroke="#374151" stroke-width="2.5"/><line x1="92" y1="262" x2="318" y2="262" stroke="#374151" stroke-width="2.5"/><line x1="92" y1="176" x2="92" y2="210" stroke="#374151" stroke-width="2.5"/><line x1="92" y1="229" x2="92" y2="262" stroke="#374151" stroke-width="2.5"/><line x1="318" y1="176" x2="318" y2="262" stroke="#374151" stroke-width="2.5"/><line x1="73" y1="214" x2="111" y2="214" stroke="#111827" stroke-width="3"/><line x1="82" y1="225" x2="102" y2="225" stroke="#111827" stroke-width="6"/><rect x="140" y="163" width="52" height="26" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="166" y="181" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" text-anchor="middle">2 &#937;</text><rect x="230" y="163" width="52" height="26" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="256" y="181" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" text-anchor="middle">4 &#937;</text><path d="M118,176 l15,0 m0,0 l-6,-4 m6,4 l-6,4" fill="none" stroke="#b91c1c" stroke-width="2"/><path d="M230,262 l-15,0 m0,0 l-6,-4 m6,4 l-6,4" fill="none" stroke="#b91c1c" stroke-width="2"/><path d="M118,205 v-15 m0,0 l-4,6 m4,-6 l4,6" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="132" y="215" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="600">1 A</text><text x="118" y="144" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="600">1 A</text><text x="222" y="146" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="middle">6 V battery</text><text x="44" y="314" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">V = 1 A &#215; 2 &#937; = 2 V and 1 A &#215; 4 &#937; = 4 V</text><text x="44" y="332" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">R = 2 + 4 = 6 &#937;, so I = V / R = 6 / 6 = 1 A</text><rect x="410" y="74" width="340" height="268" rx="12" fill="none" stroke="#374151" stroke-width="2.5"/><text x="410" y="50" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600">Parallel: more than one path</text><text x="410" y="67" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4b5563">the branch currents add up to the total current</text><line x1="490" y1="178" x2="700" y2="178" stroke="#374151" stroke-width="2.5"/><line x1="490" y1="262" x2="700" y2="262" stroke="#374151" stroke-width="2.5"/><line x1="490" y1="178" x2="490" y2="211" stroke="#374151" stroke-width="2.5"/><line x1="490" y1="230" x2="490" y2="262" stroke="#374151" stroke-width="2.5"/><line x1="700" y1="178" x2="700" y2="262" stroke="#374151" stroke-width="2.5"/><line x1="471" y1="215" x2="509" y2="215" stroke="#111827" stroke-width="3"/><line x1="480" y1="226" x2="500" y2="226" stroke="#111827" stroke-width="6"/><line x1="560" y1="178" x2="560" y2="262" stroke="#374151" stroke-width="2.5"/><line x1="650" y1="178" x2="650" y2="262" stroke="#374151" stroke-width="2.5"/><rect x="547" y="194" width="26" height="52" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="578" y="225" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827">2 &#937;</text><rect x="637" y="194" width="26" height="52" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="668" y="225" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827">3 &#937;</text><path d="M504,244 v-15 m0,0 l-4,6 m4,-6 l4,6" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="514" y="248" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="600">5 A</text><path d="M560,188 v15 m0,0 l-4,-6 m4,6 l4,-6" fill="none" stroke="#b91c1c" stroke-width="2"/><path d="M650,188 v15 m0,0 l-4,-6 m4,6 l4,-6" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="514" y="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="600">3 A</text><text x="604" y="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="600">2 A</text><text x="438" y="182" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1f2937" text-anchor="middle">6 V</text><text x="424" y="314" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">each branch gets the full 6 V: 6 / 2 = 3 A</text><text x="424" y="332" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">and 6 / 3 = 2 A, so 3 A + 2 A = 5 A total</text><line x1="30" y1="384" x2="750" y2="384" stroke="#e5e7eb" stroke-width="2"/><text x="30" y="410" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#111827" font-weight="600">Circuit symbols used above</text><line x1="66" y1="428" x2="66" y2="446" stroke="#374151" stroke-width="2.5"/><line x1="66" y1="460" x2="66" y2="478" stroke="#374151" stroke-width="2.5"/><line x1="47" y1="447" x2="85" y2="447" stroke="#111827" stroke-width="3"/><line x1="56" y1="458" x2="76" y2="458" stroke="#111827" stroke-width="6"/><text x="134" y="456" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">battery (the long plate is the + terminal)</text><rect x="404" y="439" width="52" height="26" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="430" y="457" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" text-anchor="middle">R</text><text x="478" y="456" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">resistor, in ohms</text><circle cx="430" cy="508" r="13" fill="#fff" stroke="#111827" stroke-width="2.5"/><line x1="421" y1="499" x2="439" y2="517" stroke="#111827" stroke-width="2"/><line x1="439" y1="499" x2="421" y2="517" stroke="#111827" stroke-width="2"/><line x1="417" y1="508" x2="392" y2="508" stroke="#374151" stroke-width="2.5"/><line x1="443" y1="508" x2="470" y2="508" stroke="#374151" stroke-width="2.5"/><text x="486" y="512" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">bulb (a lamp lights when current flows)</text>
</svg>
