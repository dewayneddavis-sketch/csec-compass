<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" role="img">
<title>A simple pendulum swinging through one complete oscillation per period</title>
<rect x="300" y="80" width="180" height="16" rx="3" fill="#374151"/><line x1="310" y1="80" x2="300" y2="66" stroke="#374151" stroke-width="2"/><line x1="340" y1="80" x2="330" y2="66" stroke="#374151" stroke-width="2"/><line x1="370" y1="80" x2="360" y2="66" stroke="#374151" stroke-width="2"/><line x1="400" y1="80" x2="390" y2="66" stroke="#374151" stroke-width="2"/><line x1="430" y1="80" x2="420" y2="66" stroke="#374151" stroke-width="2"/><line x1="460" y1="80" x2="450" y2="66" stroke="#374151" stroke-width="2"/><rect x="374" y="96" width="32" height="12" rx="3" fill="#111827"/><line x1="390" y1="96" x2="390" y2="108" stroke="#111827" stroke-width="3"/><line x1="390" y1="108" x2="390" y2="392" stroke="#4b5563" stroke-width="1.8" stroke-dasharray="7 6"/><path d="M390,226 A118,118 0 0 0 420.541,221.979" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="5 4"/><text x="430.54064732209747" y="215.97924750211007" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#15803d" font-weight="600">15°</text><g id="pend-arm"><animateTransform attributeName="transform" type="rotate" values="15.000 390 108;10.607 390 108;0.000 390 108;-10.607 390 108;-15.000 390 108;-10.607 390 108;-0.000 390 108;10.607 390 108;15.000 390 108" dur="2s" repeatCount="indefinite"/><line x1="390" y1="108" x2="390" y2="338" stroke="#111827" stroke-width="2.2"/><circle cx="390" cy="338" r="14" fill="rgba(185,28,28,0.10)" stroke="#b91c1c" stroke-width="2.5"/></g><path d="M383,331 l14,14 M397,331 l-14,14" fill="none" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="3 3"/><text x="406" y="380" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">The bob moves fastest at the centre of the swing:</text><text x="406" y="398" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">start the stopwatch as it passes here.</text><line x1="300" y1="108" x2="344" y2="108" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="300" y1="338" x2="370" y2="338" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="300" y1="108" x2="300" y2="338" stroke="#1d4ed8" stroke-width="1.8"/><path d="M300,107 l-4.5,9 h9 z" fill="#1d4ed8"/><path d="M300,339 l-4.5,-9 h9 z" fill="#1d4ed8"/><text x="288" y="224" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="600" text-anchor="middle" transform="rotate(-90 288 224)">l = 1.0 m</text><text x="24" y="150" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">The length is measured from the</text><text x="24" y="168" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">underside of the clamp down to the</text><text x="24" y="186" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">centre of the bob: l = 1.0 m.</text><text x="24" y="220" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">Amplitude: the small angle from the</text><text x="24" y="238" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">vertical. At small angles it does</text><text x="24" y="256" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">not change the period, and the</text><text x="24" y="274" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">mass of the bob does not either.</text><text x="24" y="310" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">One loop of the animation is one</text><text x="24" y="328" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">complete oscillation: out and back,</text><text x="24" y="346" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">then out to the other side and back.</text><text x="496" y="150" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600">T = 2 π √(l / g)</text><text x="496" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">= 2 × 3.14 × √(1.0 / 10)</text><text x="496" y="192" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600">= 2.0 s</text><text x="496" y="226" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">The animation loops once every</text><text x="496" y="244" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">2.0 s — exactly one period.</text><text x="496" y="278" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">In a real experiment air resistance</text><text x="496" y="296" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">slowly reduces the amplitude, so</text><text x="496" y="314" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">time the oscillations straight after</text><text x="496" y="332" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">releasing the bob.</text><text x="40" y="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600">A simple pendulum: one complete oscillation</text><text x="40" y="54" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4b5563">one loop of the animation lasts exactly one period, 2.0 s</text>
</svg>
