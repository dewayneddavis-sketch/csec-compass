<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img">
<title>A feasible region for x + y &lt;= 4 and x + 2y &lt;= 6 with x and y not negative, shaded, with its four corners (0, 0), (4, 0), (2, 2) and (0, 3) labelled and P = 3x + 2y worked out at each</title>
<line x1="110" y1="430" x2="600" y2="430" stroke="#374151" stroke-width="2.5"/><line x1="110" y1="430" x2="110" y2="100" stroke="#374151" stroke-width="2.5"/><polyline points="592.000,426.000 600.000,430.000 592.000,434.000" fill="none" stroke="#374151" stroke-width="2.5"/><polyline points="106.000,108.000 110.000,100.000 114.000,108.000" fill="none" stroke="#374151" stroke-width="2.5"/><line x1="110" y1="150" x2="390" y2="430" stroke="#1d4ed8" stroke-width="2.5"/><line x1="110" y1="220" x2="530" y2="430" stroke="#b91c1c" stroke-width="2.5"/><polygon points="110.000,430.000 390.000,430.000 250.000,290.000 110.000,220.000" fill="rgba(21,128,61,0.12)" stroke="#15803d" stroke-width="3" stroke-linejoin="round"/><circle cx="110" cy="430" r="5" fill="#111827" stroke="none"/><circle cx="390" cy="430" r="5" fill="#111827" stroke="none"/><circle cx="110" cy="220" r="5" fill="#111827" stroke="none"/><circle cx="250" cy="290" r="5" fill="#111827" stroke="none"/><text x="400" y="452" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827" font-weight="600">(4, 0)</text><text x="264" y="276" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827" font-weight="600">(2, 2)</text><text x="100" y="214" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827" font-weight="600" text-anchor="end">(0, 3)</text><text x="100" y="452" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827" font-weight="600" text-anchor="end">(0, 0)</text><text x="612" y="436" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600">x</text><text x="120" y="96" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600">y</text><text x="620" y="130" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="600">boundary lines</text><line x1="620" y1="152" x2="652" y2="152" stroke="#1d4ed8" stroke-width="3"/><text x="662" y="156" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">x + y = 4</text><line x1="620" y1="180" x2="652" y2="180" stroke="#b91c1c" stroke-width="3"/><text x="662" y="184" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">x + 2y = 6</text><polyline points="620.000,208.000 652.000,208.000 652.000,222.000 620.000,222.000 620.000,208.000" fill="rgba(21,128,61,0.12)" stroke="#15803d" stroke-width="1.6"/><text x="662" y="221" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">feasible region</text><text x="620" y="262" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="600">work out P at each corner</text><text x="620" y="292" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">(0, 0)   P = 0</text><text x="620" y="316" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">(4, 0)   P = 12</text><text x="620" y="340" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">(2, 2)   P = 10</text><text x="620" y="364" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">(0, 3)   P = 6</text><text x="620" y="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="600">greatest value is 12 at (4, 0)</text><text x="40" y="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600">Linear programming: the feasible region</text><text x="40" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4b5563">every constraint must hold at once: the region is what survives all the shading</text>
</svg>
