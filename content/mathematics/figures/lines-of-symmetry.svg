<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img">
<title>Lines of symmetry and rotational order counted for a square (4 lines, order 4), an equilateral triangle (3 lines, order 3) and a parallelogram (0 lines, order 2)</title>
<polygon points="72.000,172.000 228.000,172.000 228.000,328.000 72.000,328.000" fill="rgba(29,78,216,0.10)" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/><line x1="60.3" y1="160.3" x2="239.7" y2="339.7" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="7 5"/><line x1="239.7" y1="160.3" x2="60.30000000000001" y2="339.7" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="7 5"/><line x1="150" y1="160.3" x2="150" y2="339.7" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="7 5"/><line x1="60.30000000000001" y1="250" x2="239.7" y2="250" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="7 5"/><polygon points="440.000,158.000 519.674,296.000 360.326,296.000" fill="rgba(29,78,216,0.10)" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/><line x1="440" y1="144.2" x2="440" y2="355.8" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="7 5"/><line x1="348.3745122796064" y1="197.10000000000002" x2="531.6254877203936" y2="302.9" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="7 5"/><line x1="531.6254877203936" y1="197.1" x2="348.3745122796064" y2="302.9" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="7 5"/><polygon points="640.000,320.000 700.000,180.000 820.000,180.000 760.000,320.000" fill="rgba(29,78,216,0.10)" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/><text x="60" y="112" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600">Square</text><text x="360" y="112" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600">Equilateral triangle</text><text x="650" y="112" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600">Parallelogram</text><text x="150" y="372" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="middle">4 lines of symmetry</text><text x="150" y="394" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">rotational order 4</text><text x="440" y="372" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="middle">3 lines of symmetry</text><text x="440" y="394" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">rotational order 3</text><text x="730" y="372" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="middle">0 lines of symmetry</text><text x="730" y="394" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">rotational order 2</text><text x="40" y="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600">Symmetry: lines of symmetry and rotational order</text><text x="40" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4b5563">a line of symmetry is a fold; the order is how many turns land the shape on itself</text><text x="40" y="424" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4b5563">a parallelogram has rotational symmetry and no line symmetry at all</text>
</svg>
