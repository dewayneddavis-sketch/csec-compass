<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 576" width="880" height="576" role="img">
<title>A sector of a circle and a segment of a circle, with the lesson's arc, perimeter and area working</title>
<circle cx="250" cy="250" r="180" fill="none" stroke="#e5e7eb" stroke-width="1.6" stroke-dasharray="6 6"/><path d="M250,250 L365.702,387.888 A180,180 0 0 1 134.298,387.888 Z" fill="rgba(29,78,216,0.10)" stroke="none"/><line x1="250" y1="250" x2="365.7017697435771" y2="387.88799976141604" stroke="#1d4ed8" stroke-width="2.5"/><line x1="250" y1="250" x2="134.29823025642293" y2="387.88799976141604" stroke="#1d4ed8" stroke-width="2.5"/><path d="M365.702,387.888 A180,180 0 0 1 134.298,387.888" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/><path d="M285.996,292.898 A56,56 0 0 1 214.004,292.898" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="250" y="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#b91c1c" font-weight="600" text-anchor="middle">θ = 80°</text><text x="250" y="236" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#4b5563" font-weight="600" text-anchor="middle">O</text><text x="330" y="300" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1d4ed8" font-weight="600">r = 9 cm</text><text x="250" y="452" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1d4ed8" font-weight="600" text-anchor="middle">arc = 12.57 cm</text><text x="250" y="368" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">sector</text><text x="40" y="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600">Sector: r = 9 cm, θ = 80°</text><text x="40" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4b5563">the arc is the same fraction of the circle as the angle is of 360°</text><path d="M660,250 L738.000,385.100 A156,156 0 0 1 582.000,385.100 Z" fill="rgba(29,78,216,0.10)" stroke="none"/><path d="M738.000,385.100 A156,156 0 0 1 582.000,385.100 L738.000,385.100 Z" fill="rgba(185,28,28,0.10)" stroke="none"/><line x1="660" y1="250" x2="738" y2="385.09996299037243" stroke="#1d4ed8" stroke-width="2.5"/><line x1="660" y1="250" x2="582" y2="385.09996299037243" stroke="#1d4ed8" stroke-width="2.5"/><line x1="738" y1="385.09996299037243" x2="582" y2="385.09996299037243" stroke="#111827" stroke-width="2.5"/><path d="M738.000,385.100 A156,156 0 0 1 582.000,385.100" fill="none" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/><path d="M685.000,293.301 A50,50 0 0 1 635.000,293.301" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="660" y="322" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#b91c1c" font-weight="600" text-anchor="middle">θ = 60°</text><text x="660" y="236" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#4b5563" font-weight="600" text-anchor="middle">O</text><text x="722" y="302" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1d4ed8" font-weight="600">r = 6 cm</text><text x="660" y="336" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#4b5563" text-anchor="middle">triangle</text><text x="660" y="354" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1d4ed8" font-weight="600" text-anchor="middle">15.59 cm²</text><line x1="660" y1="396" x2="756" y2="428" stroke="#b91c1c" stroke-width="1.6"/><text x="762" y="432" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#b91c1c" font-weight="600">segment</text><text x="494" y="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600">Segment: r = 6 cm, θ = 60°</text><text x="494" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4b5563">a segment is the sector minus the triangle</text><line x1="40" y1="472" x2="840" y2="472" stroke="#e5e7eb" stroke-width="2"/><text x="40" y="498" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">arc = 80/360 × 2πr = 2/9 × 56.56 = 12.57 cm</text><text x="40" y="522" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">perimeter = 12.57 + 9 + 9 = 30.57 cm, so about 30.6 cm</text><text x="470" y="498" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">sector = 60/360 × 3.142 × 36 = 18.85 cm²</text><text x="470" y="522" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">triangle = 1/2 × 36 × 0.8660 = 15.59 cm²</text><text x="470" y="546" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827" font-weight="600">segment = 18.85 − 15.59 = 3.26 cm²</text>
</svg>
