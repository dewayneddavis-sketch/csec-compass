<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" width="620" height="480" role="img">
<title>A right-angled triangle labelled Opposite, Adjacent and Hypotenuse, with the three trigonometric ratios</title>
<polygon points="110.000,300.000 430.000,300.000 430.000,90.000" fill="rgba(29,78,216,0.10)" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/><polyline points="408.000,300.000 408.000,278.000 430.000,278.000" fill="none" stroke="#111827" stroke-width="2"/><path d="M153.474,271.470 A52,52 0 0 1 162.000,300.000" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="182" y="286" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#b91c1c" font-weight="600">θ</text><text x="270" y="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#15803d" font-weight="600" text-anchor="middle">Adjacent</text><text x="446" y="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#15803d" font-weight="600">Opposite</text><text x="238" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#15803d" font-weight="600" text-anchor="middle">Hypotenuse</text><text x="60" y="372" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600">SOH CAH TOA</text><text x="60" y="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#1d4ed8">Sin θ = Opposite / Hypotenuse</text><text x="60" y="424" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#1d4ed8">Cos θ = Adjacent / Hypotenuse</text><text x="60" y="448" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#1d4ed8">Tan θ = Opposite / Adjacent</text><text x="40" y="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600">Trigonometric ratios: SOH CAH TOA</text><text x="40" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4b5563">the three sides of a right-angled triangle, named from the angle θ</text>
</svg>
