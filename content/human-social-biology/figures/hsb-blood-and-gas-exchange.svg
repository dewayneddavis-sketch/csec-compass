<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1450" width="1000" height="1450" role="img"><title>Blood vessels, the components of blood, and gas exchange in an alveolus</title><rect x="0" y="0" width="1000" height="1450" fill="#ffffff"/><defs><marker id="vessels-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="vessels-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker><marker id="vessels-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="vessels-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><text x="20" y="42" font-family="Helvetica,Arial,sans-serif" font-size="28" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">BLOOD VESSELS, BLOOD AND GAS EXCHANGE</text><rect x="20" y="66" width="960" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><circle cx="190" cy="196" r="92" fill="#fca5a5" stroke="#b91c1c" stroke-width="4"/><circle cx="190" cy="196" r="44" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/><text x="40" y="322" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="start" fill="#b91c1c" font-weight="700" dominant-baseline="middle">ARTERY</text><text x="40" y="352" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">thick, muscular, elastic wall</text><text x="40" y="378" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">blood away from the heart,</text><text x="40" y="404" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">at high pressure</text><circle cx="510" cy="196" r="92" fill="#93c5fd" stroke="#1d4ed8" stroke-width="4"/><circle cx="510" cy="196" r="64" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/><text x="360" y="322" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="start" fill="#1d4ed8" font-weight="700" dominant-baseline="middle">VEIN</text><text x="360" y="352" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">thinner wall, lower pressure</text><text x="360" y="378" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">blood back towards the heart</text><circle cx="830" cy="196" r="92" fill="#fff1f2" stroke="none"/><circle cx="830" cy="196" r="88" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="26 8"/><circle cx="830" cy="196" r="82" fill="#ffffff" stroke="none"/><text x="830" y="190" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#b91c1c" font-weight="400" dominant-baseline="middle">one cell</text><text x="830" y="216" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#b91c1c" font-weight="400" dominant-baseline="middle">thick</text><text x="680" y="322" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="start" fill="#b91c1c" font-weight="700" dominant-baseline="middle">CAPILLARY</text><text x="680" y="352" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">wall only one cell thick</text><text x="680" y="378" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">materials are exchanged here</text><rect x="20" y="386" width="960" height="176" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/><text x="44" y="420" font-family="Helvetica,Arial,sans-serif" font-size="24" text-anchor="start" fill="#1d4ed8" font-weight="700" dominant-baseline="middle">A VALVE IN A VEIN</text><path d="M 300,506 L 720,506" fill="none" stroke="#1d4ed8" stroke-width="58" stroke-linecap="round"/><path d="M 300,506 L 720,506" fill="none" stroke="#bfdbfe" stroke-width="49" stroke-linecap="round"/><path d="M 450,506 C 472,480 490,480 496,506" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/><path d="M 530,506 C 552,532 570,532 576,506" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/><text x="250" y="470" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">valve cusps</text><line x1="244" y1="470" x2="466" y2="492" stroke="#64748b" stroke-width="2"/><circle cx="466" cy="492" r="4.5" fill="#64748b"/><text x="250" y="496" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="end" fill="#475569" font-weight="400" dominant-baseline="middle">they close if blood</text><text x="250" y="522" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="end" fill="#475569" font-weight="400" dominant-baseline="middle">tries to flow back</text><line x1="700" y1="506" x2="360" y2="506" stroke="#1d4ed8" stroke-width="4" marker-end="url(#vessels-blue)"/><text x="744" y="492" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#1d4ed8" font-weight="400" dominant-baseline="middle">one-way flow</text><text x="744" y="518" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">towards the heart</text><rect x="20" y="586" width="960" height="380" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/><text x="44" y="620" font-family="Helvetica,Arial,sans-serif" font-size="24" text-anchor="start" fill="#9a3412" font-weight="700" dominant-baseline="middle">THE COMPONENTS OF BLOOD</text><rect x="56" y="682" width="210" height="208" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><circle cx="100" cy="732" r="7" fill="#ca8a04"/><circle cx="140" cy="722" r="7" fill="#ca8a04"/><circle cx="180" cy="738" r="7" fill="#ca8a04"/><circle cx="110" cy="782" r="7" fill="#ca8a04"/><circle cx="170" cy="788" r="7" fill="#ca8a04"/><circle cx="216" cy="762" r="7" fill="#ca8a04"/><circle cx="96" cy="838" r="7" fill="#ca8a04"/><circle cx="150" cy="848" r="7" fill="#ca8a04"/><circle cx="198" cy="840" r="7" fill="#ca8a04"/><circle cx="130" cy="878" r="7" fill="#ca8a04"/><circle cx="176" cy="872" r="7" fill="#ca8a04"/><text x="60" y="656" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">PLASMA</text><text x="60" y="924" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">pale liquid that</text><text x="60" y="948" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">carries dissolved substances</text><ellipse cx="320" cy="716" rx="34" ry="26" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><ellipse cx="320" cy="716" rx="14" ry="10" fill="#fecaca" stroke="none"/><ellipse cx="420" cy="706" rx="34" ry="26" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><ellipse cx="420" cy="706" rx="14" ry="10" fill="#fecaca" stroke="none"/><ellipse cx="370" cy="782" rx="34" ry="26" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><ellipse cx="370" cy="782" rx="14" ry="10" fill="#fecaca" stroke="none"/><ellipse cx="440" cy="828" rx="34" ry="26" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><ellipse cx="440" cy="828" rx="14" ry="10" fill="#fecaca" stroke="none"/><ellipse cx="322" cy="828" rx="34" ry="26" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><ellipse cx="322" cy="828" rx="14" ry="10" fill="#fecaca" stroke="none"/><ellipse cx="388" cy="862" rx="34" ry="26" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><ellipse cx="388" cy="862" rx="14" ry="10" fill="#fecaca" stroke="none"/><text x="290" y="656" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">RED BLOOD CELLS</text><text x="290" y="924" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">disc-shaped, no nucleus;</text><text x="290" y="948" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">carries oxygen (haemoglobin)</text><path d="M 554.0,744 C 554.0,698.0 646.0,688.8 646.0,744 C 646.0,794.6 558.6,790.0 554.0,744 Z" fill="#e9d5ff" stroke="#7e22ce" stroke-width="3"/><circle cx="600" cy="744" r="20.7" fill="#7e22ce" opacity="0.65"/><path d="M 653.2,822 C 653.2,785.2 726.8,777.84 726.8,822 C 726.8,862.48 656.88,858.8 653.2,822 Z" fill="#e9d5ff" stroke="#7e22ce" stroke-width="3"/><circle cx="690" cy="822" r="16.560000000000002" fill="#7e22ce" opacity="0.65"/><text x="528" y="656" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">WHITE BLOOD CELLS</text><text x="528" y="924" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">fight infection</text><path d="M 800,700 L 811,708 L 807,723 L 793,723 L 789,708 Z" fill="#fde68a" stroke="#b45309" stroke-width="2"/><path d="M 850,716 L 861,724 L 857,739 L 843,739 L 839,724 Z" fill="#fde68a" stroke="#b45309" stroke-width="2"/><path d="M 820,748 L 831,756 L 827,771 L 813,771 L 809,756 Z" fill="#fde68a" stroke="#b45309" stroke-width="2"/><path d="M 786,776 L 797,784 L 793,799 L 779,799 L 775,784 Z" fill="#fde68a" stroke="#b45309" stroke-width="2"/><path d="M 846,790 L 857,798 L 853,813 L 839,813 L 835,798 Z" fill="#fde68a" stroke="#b45309" stroke-width="2"/><path d="M 806,826 L 817,834 L 813,849 L 799,849 L 795,834 Z" fill="#fde68a" stroke="#b45309" stroke-width="2"/><path d="M 856,846 L 867,854 L 863,869 L 849,869 L 845,854 Z" fill="#fde68a" stroke="#b45309" stroke-width="2"/><path d="M 832,872 L 843,880 L 839,895 L 825,895 L 821,880 Z" fill="#fde68a" stroke="#b45309" stroke-width="2"/><path d="M 786,856 L 797,864 L 793,879 L 779,879 L 775,864 Z" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="756" y="656" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">PLATELETS</text><text x="756" y="924" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">help the blood to clot</text><rect x="20" y="986" width="960" height="448" rx="14" fill="#f0f9ff" stroke="#bae6fd" stroke-width="2"/><text x="44" y="1020" font-family="Helvetica,Arial,sans-serif" font-size="24" text-anchor="start" fill="#0369a1" font-weight="700" dominant-baseline="middle">BREATHING IN, AND GAS EXCHANGE IN AN ALVEOLUS</text><path d="M 296,1112 C 236,1060 168,1098 158,1172 C 150,1246 196,1296 254,1290 C 288,1286 300,1256 300,1216 L 300,1128 Z" fill="#fecdd3" stroke="#9f1239" stroke-width="5"/><path d="M 304,1112 C 364,1060 432,1098 442,1172 C 450,1246 404,1296 346,1290 C 312,1286 300,1256 300,1216 L 300,1128 Z" fill="#fecdd3" stroke="#9f1239" stroke-width="5"/><path d="M 300,1034 L 300,1082" stroke="#9f1239" stroke-width="24" stroke-linecap="round"/><path d="M 292,1082 C 272,1098 250,1112 236,1128" stroke="#9f1239" stroke-width="15" fill="none" stroke-linecap="round"/><path d="M 308,1082 C 328,1098 350,1112 364,1128" stroke="#9f1239" stroke-width="15" fill="none" stroke-linecap="round"/><text x="300" y="1240" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#9f1239" font-weight="700" dominant-baseline="middle">lungs</text><path d="M 140,1330 C 220,1280 380,1280 460,1330" fill="none" stroke="#0e7490" stroke-width="10" stroke-linecap="round"/><line x1="300" y1="1312" x2="300" y2="1350" stroke="#0e7490" stroke-width="5" marker-end="url(#vessels-arrow)"/><text x="300" y="1392" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">breathing in (inhalation): the diaphragm moves down</text><text x="300" y="1418" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0e7490" font-weight="400" dominant-baseline="middle">diaphragm — the dome-shaped muscle below the lungs</text><path d="M 560,1104 C 620,1024 800,1016 884,1096" fill="none" stroke="#b91c1c" stroke-width="30" stroke-linecap="round"/><path d="M 560,1104 C 620,1024 800,1016 884,1096" fill="none" stroke="#fecaca" stroke-width="21" stroke-linecap="round"/><circle cx="720" cy="1180" r="112" fill="#e0f2fe" stroke="#0369a1" stroke-width="6"/><text x="720" y="1180" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#0369a1" font-weight="700" dominant-baseline="middle">ALVEOLUS</text><text x="716" y="1036" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">capillary</text><line x1="702" y1="1150" x2="718" y2="1086" stroke="#1d4ed8" stroke-width="4" marker-end="url(#vessels-blue)"/><text x="726" y="1108" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#1d4ed8" font-weight="400" dominant-baseline="middle">oxygen</text><text x="726" y="1132" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">into the blood</text><line x1="890" y1="1180" x2="836" y2="1180" stroke="#b91c1c" stroke-width="4" marker-end="url(#vessels-red)"/><text x="976" y="1160" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="end" fill="#b91c1c" font-weight="400" dominant-baseline="middle">carbon dioxide out</text><text x="976" y="1186" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="end" fill="#475569" font-weight="400" dominant-baseline="middle">of the blood</text><text x="720" y="1330" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">this is where gaseous exchange takes place</text><text x="720" y="1356" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">drawn much larger than life</text></svg>