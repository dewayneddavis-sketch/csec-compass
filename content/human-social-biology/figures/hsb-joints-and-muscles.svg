<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1370" width="1000" height="1370" role="img"><title>Panels showing a ball-and-socket and a hinge joint, the biceps and triceps working as an antagonistic pair with their tendons and ligaments, and the three kinds of muscle</title><rect x="0" y="0" width="1000" height="1370" fill="#ffffff"/><defs><marker id="joint-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="joint-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker><marker id="joint-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="joint-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><text x="20" y="42" font-family="Helvetica,Arial,sans-serif" font-size="28" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">JOINTS AND MUSCLES</text><rect x="20" y="66" width="960" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="44" y="102" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">THE TWO JOINTS THE SYLLABUS NAMES</text><path d="M 120,300 C 150,224 250,224 280,300" fill="none" stroke="#475569" stroke-width="14" stroke-linecap="round"/><circle cx="200" cy="228" r="50" fill="#f8fafc" stroke="#475569" stroke-width="6"/><path d="M 200,180 L 200,120" fill="none" stroke="#4338ca" stroke-width="28" stroke-linecap="round"/><path d="M 200,180 L 200,120" fill="none" stroke="#a5b4fc" stroke-width="19" stroke-linecap="round"/><path d="M 98,266 C 74,208 108,152 164,138" fill="none" stroke="#4338ca" stroke-width="4" marker-end="url(#joint-blue)"/><path d="M 302,266 C 326,208 292,152 236,138" fill="none" stroke="#4338ca" stroke-width="4" marker-end="url(#joint-blue)"/><text x="200" y="330" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">BALL-AND-SOCKET JOINT</text><text x="200" y="360" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">shoulder and hip</text><text x="200" y="386" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">movement in many directions</text><path d="M 496,200 C 456,226 456,292 496,318" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#joint-arrow)"/><path d="M 600,146 L 600,232" fill="none" stroke="#475569" stroke-width="30" stroke-linecap="round"/><path d="M 600,146 L 600,232" fill="none" stroke="#f8fafc" stroke-width="21" stroke-linecap="round"/><path d="M 600,278 L 600,364" fill="none" stroke="#475569" stroke-width="30" stroke-linecap="round"/><path d="M 600,278 L 600,364" fill="none" stroke="#f8fafc" stroke-width="21" stroke-linecap="round"/><circle cx="600" cy="255" r="20" fill="#ffffff" stroke="#475569" stroke-width="6"/><text x="700" y="214" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">ligament — holds the bones</text><line x1="706" y1="214" x2="626" y2="250" stroke="#64748b" stroke-width="2"/><circle cx="626" cy="250" r="4.5" fill="#64748b"/><text x="700" y="240" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">together at a joint</text><text x="600" y="330" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">HINGE JOINT</text><text x="600" y="360" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">elbow and knee</text><text x="600" y="386" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">movement in one direction</text><rect x="20" y="420" width="960" height="390" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/><text x="44" y="456" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="start" fill="#9a3412" font-weight="700" dominant-baseline="middle">AN ANTAGONISTIC PAIR — THE BICEPS AND THE TRICEPS</text><circle cx="230" cy="520" r="16" fill="#ffffff" stroke="#475569" stroke-width="5"/><path d="M 230,520 L 230,650" fill="none" stroke="#475569" stroke-width="28" stroke-linecap="round"/><path d="M 230,520 L 230,650" fill="none" stroke="#f8fafc" stroke-width="19" stroke-linecap="round"/><path d="M 230,650 L 400,592" fill="none" stroke="#475569" stroke-width="24" stroke-linecap="round"/><path d="M 230,650 L 400,592" fill="none" stroke="#f8fafc" stroke-width="15" stroke-linecap="round"/><line x1="186" y1="516" x2="230" y2="524" stroke="#b91c1c" stroke-width="5"/><line x1="186" y1="584" x2="244" y2="644" stroke="#b91c1c" stroke-width="5"/><g transform="translate(186,550) rotate(90)"><ellipse cx="0" cy="0" rx="34" ry="30" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/></g><line x1="274" y1="508" x2="230" y2="524" stroke="#1d4ed8" stroke-width="5"/><line x1="274" y1="592" x2="244" y2="644" stroke="#1d4ed8" stroke-width="5"/><g transform="translate(274,550) rotate(90)"><ellipse cx="0" cy="0" rx="42" ry="12" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/></g><text x="120" y="480" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">biceps</text><line x1="114" y1="480" x2="172" y2="512" stroke="#64748b" stroke-width="2"/><circle cx="172" cy="512" r="4.5" fill="#64748b"/><text x="330" y="480" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">triceps</text><line x1="336" y1="480" x2="288" y2="512" stroke="#64748b" stroke-width="2"/><circle cx="288" cy="512" r="4.5" fill="#64748b"/><text x="230" y="700" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">the arm BENDS (flexes)</text><text x="230" y="728" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">biceps contracts (agonist);</text><text x="230" y="752" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">triceps relaxes (antagonist)</text><circle cx="700" cy="520" r="16" fill="#ffffff" stroke="#475569" stroke-width="5"/><path d="M 700,520 L 700,650" fill="none" stroke="#475569" stroke-width="28" stroke-linecap="round"/><path d="M 700,520 L 700,650" fill="none" stroke="#f8fafc" stroke-width="19" stroke-linecap="round"/><path d="M 700,650 L 920,650" fill="none" stroke="#475569" stroke-width="24" stroke-linecap="round"/><path d="M 700,650 L 920,650" fill="none" stroke="#f8fafc" stroke-width="15" stroke-linecap="round"/><line x1="656" y1="508" x2="700" y2="524" stroke="#b91c1c" stroke-width="5"/><line x1="656" y1="592" x2="714" y2="644" stroke="#b91c1c" stroke-width="5"/><g transform="translate(656,550) rotate(90)"><ellipse cx="0" cy="0" rx="42" ry="12" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/></g><line x1="744" y1="516" x2="700" y2="524" stroke="#1d4ed8" stroke-width="5"/><line x1="744" y1="584" x2="714" y2="644" stroke="#1d4ed8" stroke-width="5"/><g transform="translate(744,550) rotate(90)"><ellipse cx="0" cy="0" rx="34" ry="30" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/></g><text x="590" y="480" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">biceps</text><line x1="584" y1="480" x2="642" y2="512" stroke="#64748b" stroke-width="2"/><circle cx="642" cy="512" r="4.5" fill="#64748b"/><text x="800" y="480" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">triceps</text><line x1="806" y1="480" x2="758" y2="512" stroke="#64748b" stroke-width="2"/><circle cx="758" cy="512" r="4.5" fill="#64748b"/><text x="730" y="700" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">the arm STRAIGHTENS (extends)</text><text x="730" y="728" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">triceps contracts (agonist);</text><text x="730" y="752" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">biceps relaxes (antagonist)</text><text x="150" y="618" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">tendon</text><line x1="144" y1="618" x2="202" y2="599" stroke="#64748b" stroke-width="2"/><circle cx="202" cy="599" r="4.5" fill="#64748b"/><rect x="20" y="856" width="960" height="350" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="44" y="892" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">THE THREE KINDS OF MUSCLE</text><rect x="60" y="916" width="260" height="264" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="190" y="950" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">SKELETAL MUSCLE</text><rect x="90" y="990" width="200" height="26" rx="13" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><line x1="108" y1="990" x2="108" y2="1016" stroke="#b91c1c" stroke-width="2.5"/><line x1="138" y1="990" x2="138" y2="1016" stroke="#b91c1c" stroke-width="2.5"/><line x1="168" y1="990" x2="168" y2="1016" stroke="#b91c1c" stroke-width="2.5"/><line x1="198" y1="990" x2="198" y2="1016" stroke="#b91c1c" stroke-width="2.5"/><line x1="228" y1="990" x2="228" y2="1016" stroke="#b91c1c" stroke-width="2.5"/><line x1="258" y1="990" x2="258" y2="1016" stroke="#b91c1c" stroke-width="2.5"/><rect x="90" y="1024" width="200" height="26" rx="13" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><line x1="108" y1="1024" x2="108" y2="1050" stroke="#b91c1c" stroke-width="2.5"/><line x1="138" y1="1024" x2="138" y2="1050" stroke="#b91c1c" stroke-width="2.5"/><line x1="168" y1="1024" x2="168" y2="1050" stroke="#b91c1c" stroke-width="2.5"/><line x1="198" y1="1024" x2="198" y2="1050" stroke="#b91c1c" stroke-width="2.5"/><line x1="228" y1="1024" x2="228" y2="1050" stroke="#b91c1c" stroke-width="2.5"/><line x1="258" y1="1024" x2="258" y2="1050" stroke="#b91c1c" stroke-width="2.5"/><rect x="90" y="1058" width="200" height="26" rx="13" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><line x1="108" y1="1058" x2="108" y2="1084" stroke="#b91c1c" stroke-width="2.5"/><line x1="138" y1="1058" x2="138" y2="1084" stroke="#b91c1c" stroke-width="2.5"/><line x1="168" y1="1058" x2="168" y2="1084" stroke="#b91c1c" stroke-width="2.5"/><line x1="198" y1="1058" x2="198" y2="1084" stroke="#b91c1c" stroke-width="2.5"/><line x1="228" y1="1058" x2="228" y2="1084" stroke="#b91c1c" stroke-width="2.5"/><line x1="258" y1="1058" x2="258" y2="1084" stroke="#b91c1c" stroke-width="2.5"/><rect x="90" y="1092" width="200" height="26" rx="13" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><line x1="108" y1="1092" x2="108" y2="1118" stroke="#b91c1c" stroke-width="2.5"/><line x1="138" y1="1092" x2="138" y2="1118" stroke="#b91c1c" stroke-width="2.5"/><line x1="168" y1="1092" x2="168" y2="1118" stroke="#b91c1c" stroke-width="2.5"/><line x1="198" y1="1092" x2="198" y2="1118" stroke="#b91c1c" stroke-width="2.5"/><line x1="228" y1="1092" x2="228" y2="1118" stroke="#b91c1c" stroke-width="2.5"/><line x1="258" y1="1092" x2="258" y2="1118" stroke="#b91c1c" stroke-width="2.5"/><text x="190" y="1130" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">moves the skeleton</text><text x="190" y="1156" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">voluntary</text><rect x="372" y="916" width="260" height="264" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="502" y="950" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">CARDIAC MUSCLE</text><g transform="translate(502,1044) rotate(0)"><rect x="-54.0" y="-15" width="108" height="30" rx="15" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><line x1="-38.0" y1="-15" x2="-38.0" y2="15" stroke="#b91c1c" stroke-width="2.5"/><line x1="-18.0" y1="-15" x2="-18.0" y2="15" stroke="#b91c1c" stroke-width="2.5"/><line x1="2.0" y1="-15" x2="2.0" y2="15" stroke="#b91c1c" stroke-width="2.5"/><line x1="22.0" y1="-15" x2="22.0" y2="15" stroke="#b91c1c" stroke-width="2.5"/></g><g transform="translate(448,1044) rotate(26)"><rect x="-37.0" y="-15" width="74" height="30" rx="15" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><line x1="-21.0" y1="-15" x2="-21.0" y2="15" stroke="#b91c1c" stroke-width="2.5"/><line x1="-1.0" y1="-15" x2="-1.0" y2="15" stroke="#b91c1c" stroke-width="2.5"/></g><g transform="translate(556,1044) rotate(154)"><rect x="-37.0" y="-15" width="74" height="30" rx="15" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><line x1="-21.0" y1="-15" x2="-21.0" y2="15" stroke="#b91c1c" stroke-width="2.5"/><line x1="-1.0" y1="-15" x2="-1.0" y2="15" stroke="#b91c1c" stroke-width="2.5"/></g><text x="502" y="1130" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">only in the heart</text><text x="502" y="1156" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">never tires</text><rect x="684" y="916" width="260" height="264" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="814" y="950" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">SMOOTH MUSCLE</text><rect x="714" y="990" width="200" height="26" rx="13" fill="#a7f3d0" stroke="#15803d" stroke-width="3"/><rect x="714" y="1024" width="200" height="26" rx="13" fill="#a7f3d0" stroke="#15803d" stroke-width="3"/><rect x="714" y="1058" width="200" height="26" rx="13" fill="#a7f3d0" stroke="#15803d" stroke-width="3"/><rect x="714" y="1092" width="200" height="26" rx="13" fill="#a7f3d0" stroke="#15803d" stroke-width="3"/><text x="814" y="1130" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">walls of organs</text><text x="814" y="1156" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">involuntary</text><rect x="20" y="1222" width="960" height="128" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="44" y="1256" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">Muscles can only pull, never push — which is why they work in antagonistic pairs:</text><text x="44" y="1284" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">the muscle that contracts is the agonist, and the one that relaxes is the antagonist.</text><text x="44" y="1312" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">A tendon attaches a muscle to a bone; a ligament holds the bones together at a joint.</text></svg>