<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1330" width="1000" height="1330" role="img"><title>A kidney in section beside one nephron, showing filtration, reabsorption and the path of urine</title><rect x="0" y="0" width="1000" height="1330" fill="#ffffff"/><defs><marker id="kidney-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="kidney-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker><marker id="kidney-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="kidney-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><text x="20" y="42" font-family="Helvetica,Arial,sans-serif" font-size="28" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">THE KIDNEY AND THE NEPHRON</text><path d="M 320,90 C 410,90 468,150 468,215 C 468,240 445,262 425,278 C 445,294 468,318 468,352 C 468,430 410,510 320,510 C 225,510 170,420 170,300 C 170,180 225,90 320,90 Z" fill="#fecdd3" stroke="#9f1239" stroke-width="6"/><path d="M 320,140 C 392,140 432,186 432,240 C 432,258 415,272 400,286 C 415,300 432,314 432,336 C 432,398 392,460 320,460 C 245,460 208,392 208,300 C 208,208 245,140 320,140 Z" fill="none" stroke="#db2777" stroke-width="3"/><path d="M 300,170 C 345,184 372,258 400,286 C 372,314 345,226 300,240 Z" fill="#fda4af" stroke="#be123c" stroke-width="3"/><path d="M 300,258 C 345,272 372,258 400,286 C 372,314 345,320 300,334 Z" fill="#fda4af" stroke="#be123c" stroke-width="3"/><path d="M 300,350 C 345,364 372,258 400,286 C 372,314 345,406 300,420 Z" fill="#fda4af" stroke="#be123c" stroke-width="3"/><path d="M 400,252 C 428,266 448,278 456,288 C 448,298 428,310 400,324 C 412,288 412,288 400,252 Z" fill="#fef3c7" stroke="#b45309" stroke-width="3"/><path d="M 700,236 C 640,240 560,244 470,250" fill="none" stroke="#9f1239" stroke-width="34" stroke-linecap="round"/><path d="M 700,236 C 640,240 560,244 470,250" fill="none" stroke="#fca5a5" stroke-width="25" stroke-linecap="round"/><path d="M 700,348 C 640,344 560,340 470,334" fill="none" stroke="#9f1239" stroke-width="34" stroke-linecap="round"/><path d="M 700,348 C 640,344 560,340 470,334" fill="none" stroke="#93c5fd" stroke-width="25" stroke-linecap="round"/><line x1="556" y1="248" x2="512" y2="251" stroke="#b91c1c" stroke-width="4" marker-end="url(#kidney-red)"/><line x1="512" y1="337" x2="556" y2="340" stroke="#1d4ed8" stroke-width="4" marker-end="url(#kidney-blue)"/><path d="M 446,308 C 470,380 476,470 478,548 C 479,584 480,604 481,624" fill="none" stroke="#b45309" stroke-width="26" stroke-linecap="round"/><path d="M 446,308 C 470,380 476,470 478,548 C 479,584 480,604 481,624" fill="none" stroke="#fef3c7" stroke-width="17" stroke-linecap="round"/><text x="110" y="180" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">cortex</text><line x1="104" y1="180" x2="254" y2="186" stroke="#64748b" stroke-width="2"/><circle cx="254" cy="186" r="4.5" fill="#64748b"/><text x="110" y="300" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">medulla</text><line x1="104" y1="300" x2="330" y2="300" stroke="#64748b" stroke-width="2"/><circle cx="330" cy="300" r="4.5" fill="#64748b"/><text x="716" y="236" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">renal artery</text><line x1="722" y1="236" x2="690" y2="236" stroke="#64748b" stroke-width="2"/><circle cx="690" cy="236" r="4.5" fill="#64748b"/><text x="716" y="264" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">blood in</text><text x="716" y="348" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">renal vein</text><line x1="722" y1="348" x2="690" y2="348" stroke="#64748b" stroke-width="2"/><circle cx="690" cy="348" r="4.5" fill="#64748b"/><text x="716" y="376" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">blood out</text><text x="560" y="288" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">renal pelvis</text><line x1="566" y1="288" x2="460" y2="288" stroke="#64748b" stroke-width="2"/><circle cx="460" cy="288" r="4.5" fill="#64748b"/><text x="620" y="560" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">ureter</text><line x1="626" y1="560" x2="486" y2="560" stroke="#64748b" stroke-width="2"/><circle cx="486" cy="560" r="4.5" fill="#64748b"/><text x="620" y="588" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">urine to the bladder</text><rect x="40" y="660" width="920" height="520" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><text x="950" y="694" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="end" fill="#475569" font-weight="400" dominant-baseline="middle">One nephron — a kidney has many; drawn much larger than life</text><path d="M 230,834 C 300,880 340,800 386,846 C 424,884 460,806 502,850 C 532,880 556,878 572,858" fill="none" stroke="#c2410c" stroke-width="20" stroke-linecap="round"/><path d="M 230,834 C 300,880 340,800 386,846 C 424,884 460,806 502,850 C 532,880 556,878 572,858" fill="none" stroke="#fdba74" stroke-width="12" stroke-linecap="round"/><path d="M 572,858 C 594,896 592,960 586,1016 C 582,1058 620,1066 644,1030 C 662,1004 670,950 674,898 C 676,870 686,856 700,846" fill="none" stroke="#c2410c" stroke-width="20" stroke-linecap="round"/><path d="M 572,858 C 594,896 592,960 586,1016 C 582,1058 620,1066 644,1030 C 662,1004 670,950 674,898 C 676,870 686,856 700,846" fill="none" stroke="#fdba74" stroke-width="12" stroke-linecap="round"/><path d="M 700,846 C 726,838 744,862 770,860 C 792,858 798,884 798,910" fill="none" stroke="#c2410c" stroke-width="20" stroke-linecap="round"/><path d="M 700,846 C 726,838 744,862 770,860 C 792,858 798,884 798,910" fill="none" stroke="#fdba74" stroke-width="12" stroke-linecap="round"/><path d="M 798,912 L 798,1140" fill="none" stroke="#c2410c" stroke-width="26" stroke-linecap="round"/><path d="M 798,912 L 798,1140" fill="none" stroke="#fef3c7" stroke-width="16" stroke-linecap="round"/><line x1="798" y1="1058" x2="798" y2="1130" stroke="#b45309" stroke-width="4" marker-end="url(#kidney-amber)"/><path d="M 60,788 C 108,792 132,798 148,804" fill="none" stroke="#b91c1c" stroke-width="11" stroke-linecap="round"/><path d="M 148,858 C 116,874 92,884 60,890" fill="none" stroke="#1d4ed8" stroke-width="11" stroke-linecap="round"/><circle cx="196" cy="812" r="64" fill="#ffffff" stroke="#c2410c" stroke-width="5"/><ellipse cx="196" cy="812" rx="42" ry="38" fill="#fca5a5" stroke="#b91c1c" stroke-width="4"/><path d="M 164,798 C 190,776 226,782 234,808 C 242,834 216,854 192,846" fill="none" stroke="#b91c1c" stroke-width="5"/><path d="M 168,830 C 184,850 218,852 232,834" fill="none" stroke="#b91c1c" stroke-width="5"/><line x1="232" y1="884" x2="252" y2="908" stroke="#c2410c" stroke-width="3" marker-end="url(#kidney-amber)"/><path d="M 300,978 C 400,972 520,978 660,972" fill="none" stroke="#b91c1c" stroke-width="16" stroke-linecap="round"/><path d="M 300,978 C 400,972 520,978 660,972" fill="none" stroke="#fca5a5" stroke-width="9" stroke-linecap="round"/><line x1="352" y1="934" x2="352" y2="966" stroke="#b91c1c" stroke-width="3" marker-end="url(#kidney-red)"/><line x1="466" y1="934" x2="466" y2="966" stroke="#b91c1c" stroke-width="3" marker-end="url(#kidney-red)"/><line x1="580" y1="934" x2="580" y2="966" stroke="#b91c1c" stroke-width="3" marker-end="url(#kidney-red)"/><line x1="640" y1="970" x2="640" y2="938" stroke="#b91c1c" stroke-width="3" marker-end="url(#kidney-red)"/><text x="60" y="712" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">glomerulus</text><line x1="66" y1="712" x2="168" y2="790" stroke="#64748b" stroke-width="2"/><circle cx="168" cy="790" r="4.5" fill="#64748b"/><text x="60" y="738" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">a knot of capillaries</text><text x="300" y="940" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">filtration</text><text x="60" y="912" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">Bowman's capsule</text><line x1="66" y1="912" x2="170" y2="866" stroke="#64748b" stroke-width="2"/><circle cx="170" cy="866" r="4.5" fill="#64748b"/><text x="452" y="790" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">proximal tubule</text><line x1="458" y1="790" x2="420" y2="862" stroke="#64748b" stroke-width="2"/><circle cx="420" cy="862" r="4.5" fill="#64748b"/><text x="560" y="1094" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">loop of Henle</text><line x1="554" y1="1094" x2="600" y2="1058" stroke="#64748b" stroke-width="2"/><circle cx="600" cy="1058" r="4.5" fill="#64748b"/><text x="816" y="1000" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">collecting duct</text><line x1="822" y1="1000" x2="802" y2="1000" stroke="#64748b" stroke-width="2"/><circle cx="802" cy="1000" r="4.5" fill="#64748b"/><text x="816" y="1028" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">urine → pelvis</text><text x="220" y="978" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">capillary</text><line x1="214" y1="978" x2="300" y2="978" stroke="#64748b" stroke-width="2"/><circle cx="300" cy="978" r="4.5" fill="#64748b"/><text x="470" y="1004" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#b91c1c" font-weight="400" dominant-baseline="middle">reabsorption ↓</text><text x="470" y="1028" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">into the blood</text><text x="790" y="1004" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="end" fill="#b91c1c" font-weight="400" dominant-baseline="middle">secretion ↑</text><text x="790" y="1028" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="end" fill="#475569" font-weight="400" dominant-baseline="middle">into the tubule</text><rect x="40" y="1220" width="920" height="66" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="60" y="1252" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">Urine path:  kidney  →  ureter  →  bladder  →  urethra (leaves the body)</text></svg>