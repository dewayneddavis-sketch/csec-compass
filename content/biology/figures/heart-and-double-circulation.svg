<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1270" width="1000" height="1270" role="img"><title>The heart and the double circulation through the lungs and the body</title><rect x="0" y="0" width="1000" height="1270" fill="#ffffff"/><defs><marker id="heart-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="heart-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker><marker id="heart-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="heart-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><text x="500" y="44" font-family="Helvetica,Arial,sans-serif" font-size="28" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">LUNGS</text><text x="500" y="78" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">blood picks up oxygen and gives up carbon dioxide</text><path d="M 372,140 C 330,108 258,112 232,158 C 202,212 214,300 264,326 C 306,348 356,330 372,300 Z" fill="#fecdd3" stroke="#9f1239" stroke-width="5"/><path d="M 628,140 C 670,108 742,112 768,158 C 798,212 786,300 736,326 C 694,348 644,330 628,300 Z" fill="#fecdd3" stroke="#9f1239" stroke-width="5"/><path d="M 300,1006 C 196,860 150,626 246,520 C 280,484 316,468 356,462" fill="none" stroke="#1d4ed8" stroke-width="38" stroke-linecap="round"/><path d="M 300,1006 C 196,860 150,626 246,520 C 280,484 316,468 356,462" fill="none" stroke="#93c5fd" stroke-width="29" stroke-linecap="round"/><path d="M 366,586 C 340,520 322,432 330,336" fill="none" stroke="#1d4ed8" stroke-width="38" stroke-linecap="round"/><path d="M 366,586 C 340,520 322,432 330,336" fill="none" stroke="#93c5fd" stroke-width="29" stroke-linecap="round"/><path d="M 660,336 C 692,382 682,424 640,456" fill="none" stroke="#b91c1c" stroke-width="38" stroke-linecap="round"/><path d="M 660,336 C 692,382 682,424 640,456" fill="none" stroke="#fca5a5" stroke-width="29" stroke-linecap="round"/><path d="M 640,586 C 666,522 702,474 762,474 C 830,474 862,532 864,612 L 866,930 C 866,974 812,1000 750,1006" fill="none" stroke="#b91c1c" stroke-width="38" stroke-linecap="round"/><path d="M 640,586 C 666,522 702,474 762,474 C 830,474 862,532 864,612 L 866,930 C 866,974 812,1000 750,1006" fill="none" stroke="#fca5a5" stroke-width="29" stroke-linecap="round"/><path d="M 366,412 L 634,412 C 676,412 700,438 700,478 C 706,600 664,742 588,832 C 548,878 510,906 500,916 C 490,906 452,878 412,832 C 336,742 294,600 300,478 C 300,438 324,412 366,412 Z" fill="#f8fafc" stroke="#334155" stroke-width="6"/><rect x="350" y="450" width="130" height="112" rx="16" fill="#93c5fd" stroke="#1d4ed8" stroke-width="4"/><rect x="520" y="450" width="130" height="112" rx="16" fill="#fca5a5" stroke="#b91c1c" stroke-width="4"/><rect x="350" y="592" width="130" height="228" rx="16" fill="#93c5fd" stroke="#1d4ed8" stroke-width="4"/><rect x="520" y="592" width="130" height="228" rx="16" fill="#fca5a5" stroke="#b91c1c" stroke-width="4"/><rect x="480" y="450" width="40" height="370" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/><path d="M 387,590 L 415,620 L 443,590" fill="#ffffff" stroke="#475569" stroke-width="3"/><path d="M 557,590 L 585,620 L 613,590" fill="#ffffff" stroke="#475569" stroke-width="3"/><text x="415" y="492" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#1e3a8a" font-weight="700" dominant-baseline="middle">RIGHT</text><text x="415" y="522" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#1e3a8a" font-weight="700" dominant-baseline="middle">ATRIUM</text><text x="585" y="492" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#7f1d1d" font-weight="700" dominant-baseline="middle">LEFT</text><text x="585" y="522" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#7f1d1d" font-weight="700" dominant-baseline="middle">ATRIUM</text><text x="415" y="632" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#1e3a8a" font-weight="700" dominant-baseline="middle">RIGHT</text><text x="415" y="662" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#1e3a8a" font-weight="700" dominant-baseline="middle">VENTRICLE</text><text x="585" y="632" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#7f1d1d" font-weight="700" dominant-baseline="middle">LEFT</text><text x="585" y="662" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#7f1d1d" font-weight="700" dominant-baseline="middle">VENTRICLE</text><line x1="415" y1="720" x2="415" y2="790" stroke="#475569" stroke-width="4" marker-end="url(#heart-arrow)"/><line x1="585" y1="720" x2="585" y2="790" stroke="#475569" stroke-width="4" marker-end="url(#heart-arrow)"/><text x="286" y="424" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">pulmonary artery</text><line x1="280" y1="424" x2="330" y2="430" stroke="#64748b" stroke-width="2"/><circle cx="330" cy="430" r="4.5" fill="#64748b"/><text x="286" y="452" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="end" fill="#475569" font-weight="400" dominant-baseline="middle">to the lungs</text><text x="286" y="476" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="end" fill="#1d4ed8" font-weight="400" dominant-baseline="middle">(deoxygenated)</text><text x="180" y="700" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">vena cava</text><line x1="174" y1="700" x2="190" y2="700" stroke="#64748b" stroke-width="2"/><circle cx="190" cy="700" r="4.5" fill="#64748b"/><text x="180" y="728" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="end" fill="#475569" font-weight="400" dominant-baseline="middle">from the body</text><text x="180" y="752" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="end" fill="#1d4ed8" font-weight="400" dominant-baseline="middle">(deoxygenated)</text><text x="714" y="398" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">pulmonary vein</text><line x1="720" y1="398" x2="672" y2="396" stroke="#64748b" stroke-width="2"/><circle cx="672" cy="396" r="4.5" fill="#64748b"/><text x="714" y="424" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">from the lungs</text><text x="714" y="448" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#b91c1c" font-weight="400" dominant-baseline="middle">(oxygenated)</text><text x="714" y="700" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">aorta</text><line x1="720" y1="700" x2="868" y2="700" stroke="#64748b" stroke-width="2"/><circle cx="868" cy="700" r="4.5" fill="#64748b"/><text x="714" y="728" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">to the body</text><text x="714" y="752" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#b91c1c" font-weight="400" dominant-baseline="middle">(oxygenated)</text><text x="286" y="566" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">valves</text><line x1="280" y1="566" x2="405" y2="600" stroke="#64748b" stroke-width="2"/><circle cx="405" cy="600" r="4.5" fill="#64748b"/><text x="286" y="594" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="end" fill="#475569" font-weight="400" dominant-baseline="middle">one-way flow</text><line x1="500" y1="944" x2="500" y2="886" stroke="#64748b" stroke-width="2"/><circle cx="500" cy="886" r="4.5" fill="#64748b"/><text x="500" y="962" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">septum — keeps the two sides apart</text><rect x="300" y="1010" width="460" height="104" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="3"/><text x="530" y="1046" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">BODY TISSUES AND ORGANS</text><text x="530" y="1080" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">capillaries deliver oxygen, take up carbon dioxide</text><line x1="360" y1="1004" x2="336" y2="976" stroke="#1d4ed8" stroke-width="6" marker-end="url(#heart-blue)"/><line x1="806" y1="984" x2="778" y2="1008" stroke="#b91c1c" stroke-width="6" marker-end="url(#heart-red)"/><rect x="20" y="1136" width="960" height="118" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="1164" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">Blue = deoxygenated blood.   Red = oxygenated blood.</text><text x="40" y="1192" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">The right side of the heart carries deoxygenated blood; the left side carries oxygenated blood.</text><text x="40" y="1220" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">Path of blood: body → vena cava → right atrium → right ventricle → pulmonary artery → lungs</text><text x="40" y="1246" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">→ pulmonary vein → left atrium → left ventricle → aorta → body</text></svg>