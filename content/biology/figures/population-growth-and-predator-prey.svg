<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1010" width="1000" height="1010" role="img"><title>Population growth drawn as a J-shaped curve and an S-shape levelling off at the carrying capacity, beside predator and prey curves with the predator lagging behind the prey</title><rect x="0" y="0" width="1000" height="1010" fill="#ffffff"/><defs><marker id="pop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="pop-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker><marker id="pop-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="pop-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><text x="500" y="42" font-family="Helvetica,Arial,sans-serif" font-size="26" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">POPULATION GROWTH, CARRYING CAPACITY, PREDATOR AND PREY</text><rect x="20" y="80" width="470" height="560" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="255" y="116" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">growth, then an S-shape</text><line x1="70" y1="590" x2="470" y2="590" stroke="#475569" stroke-width="3" marker-end="url(#pop-arrow)"/><line x1="70" y1="590" x2="70" y2="150" stroke="#475569" stroke-width="3" marker-end="url(#pop-arrow)"/><text x="270" y="622" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">generation</text><text x="40" y="370" transform="rotate(-90 40 370)" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#475569" dominant-baseline="middle">number of individuals</text><line x1="80" y1="250" x2="462" y2="250" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 7"/><polyline points="96.0,590.0 101.0,589.7 106.0,589.4 111.0,589.1 116.1,588.7 121.1,588.4 126.1,588.0 131.1,587.5 136.1,587.1 141.1,586.6 146.1,586.1 151.2,585.5 156.2,585.0 161.2,584.3 166.2,583.7 171.2,583.0 176.2,582.2 181.2,581.4 186.3,580.5 191.3,579.6 196.3,578.6 201.3,577.6 206.3,576.5 211.3,575.3 216.3,574.0 221.4,572.6 226.4,571.2 231.4,569.6 236.4,568.0 241.4,566.2 246.4,564.4 251.4,562.4 256.5,560.2 261.5,557.9 266.5,555.5 271.5,552.9 276.5,550.1 281.5,547.2 286.5,544.0 291.5,540.7 296.6,537.1 301.6,533.3 306.6,529.2 311.6,524.8 316.6,520.2 321.6,515.2 326.6,509.9 331.7,504.3 336.7,498.2 341.7,491.8 346.7,484.9 351.7,477.6 356.7,469.8 361.7,461.5 366.8,452.6 371.8,443.1 376.8,433.0 381.8,422.2 386.8,410.7 391.8,398.4 396.8,385.3 401.9,371.3 406.9,356.3 411.9,340.4 416.9,323.4 421.9,305.3 426.9,286.0 431.9,265.3 437.0,243.3 442.0,219.8 447.0,194.7 452.0,168.0" fill="none" stroke="#9f1239" stroke-width="5"/><polyline points="96.0,584.2 101.0,583.4 106.0,582.5 111.0,581.6 116.1,580.4 121.1,579.2 126.1,577.8 131.1,576.2 136.1,574.4 141.1,572.4 146.1,570.2 151.2,567.7 156.2,564.9 161.2,561.8 166.2,558.3 171.2,554.5 176.2,550.2 181.2,545.6 186.3,540.4 191.3,534.8 196.3,528.7 201.3,522.1 206.3,514.9 211.3,507.3 216.3,499.1 221.4,490.4 226.4,481.2 231.4,471.7 236.4,461.7 241.4,451.4 246.4,440.9 251.4,430.2 256.5,419.5 261.5,408.7 266.5,398.0 271.5,387.5 276.5,377.3 281.5,367.4 286.5,357.8 291.5,348.7 296.6,340.1 301.6,331.9 306.6,324.3 311.6,317.2 316.6,310.6 321.6,304.6 326.6,299.0 331.7,293.9 336.7,289.3 341.7,285.1 346.7,281.3 351.7,277.9 356.7,274.8 361.7,272.1 366.8,269.6 371.8,267.4 376.8,265.4 381.8,263.6 386.8,262.1 391.8,260.7 396.8,259.4 401.9,258.3 406.9,257.4 411.9,256.5 416.9,255.8 421.9,255.1 426.9,254.5 431.9,254.0 437.0,253.5 442.0,253.1 447.0,252.7 452.0,252.4" fill="none" stroke="#15803d" stroke-width="5"/><line x1="90" y1="158" x2="126" y2="158" stroke="#9f1239" stroke-width="5"/><text x="136" y="158" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="start" fill="#9f1239" font-weight="400" dominant-baseline="middle">J-shaped curve</text><line x1="90" y1="190" x2="126" y2="190" stroke="#15803d" stroke-width="5"/><text x="136" y="190" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="start" fill="#15803d" font-weight="400" dominant-baseline="middle">S-shape</text><line x1="90" y1="222" x2="126" y2="222" stroke="#b91c1c" stroke-width="3" stroke-dasharray="10 7"/><text x="136" y="222" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="start" fill="#b91c1c" font-weight="400" dominant-baseline="middle">carrying capacity</text><text x="430" y="190" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="end" fill="#9f1239" font-weight="400" dominant-baseline="middle">exponential growth</text><line x1="424" y1="190" x2="449" y2="174" stroke="#64748b" stroke-width="2"/><circle cx="449" cy="174" r="4.5" fill="#64748b"/><rect x="510" y="80" width="470" height="560" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="745" y="116" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">predator and prey</text><text x="745" y="148" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">the predator lags behind the prey</text><line x1="570" y1="182" x2="606" y2="182" stroke="#15803d" stroke-width="5"/><text x="616" y="182" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="start" fill="#15803d" font-weight="400" dominant-baseline="middle">prey</text><line x1="700" y1="182" x2="736" y2="182" stroke="#b91c1c" stroke-width="5"/><text x="746" y="182" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="start" fill="#b91c1c" font-weight="400" dominant-baseline="middle">predator</text><line x1="560" y1="590" x2="960" y2="590" stroke="#475569" stroke-width="3" marker-end="url(#pop-arrow)"/><line x1="560" y1="590" x2="560" y2="212" stroke="#475569" stroke-width="3" marker-end="url(#pop-arrow)"/><text x="760" y="622" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">generation</text><polyline points="580.0,430.0 585.2,416.8 590.4,403.8 595.6,391.2 600.8,379.4 606.1,368.4 611.3,358.5 616.5,349.9 621.7,342.7 626.9,337.0 632.1,332.9 637.3,330.6 642.5,330.0 647.7,331.2 653.0,334.1 658.2,338.7 663.4,344.9 668.6,352.6 673.8,361.7 679.0,371.9 684.2,383.2 689.4,395.3 694.6,408.1 699.9,421.2 705.1,434.4 710.3,447.6 715.5,460.5 720.7,472.8 725.9,484.4 731.1,495.0 736.3,504.5 741.5,512.7 746.8,519.4 752.0,524.5 757.2,528.0 762.4,529.8 767.6,529.8 772.8,528.0 778.0,524.5 783.2,519.4 788.5,512.7 793.7,504.5 798.9,495.0 804.1,484.4 809.3,472.8 814.5,460.5 819.7,447.6 824.9,434.4 830.1,421.2 835.4,408.1 840.6,395.3 845.8,383.2 851.0,371.9 856.2,361.7 861.4,352.6 866.6,344.9 871.8,338.7 877.0,334.1 882.3,331.2 887.5,330.0 892.7,330.6 897.9,332.9 903.1,337.0 908.3,342.7 913.5,349.9 918.7,358.5 923.9,368.4 929.2,379.4 934.4,391.2 939.6,403.8 944.8,416.8 950.0,430.0" fill="none" stroke="#15803d" stroke-width="5"/><polyline points="580.0,544.4 585.2,538.5 590.4,531.5 595.6,523.5 600.8,514.7 606.1,505.1 611.3,495.1 616.5,484.6 621.7,474.0 626.9,463.5 632.1,453.1 637.3,443.1 642.5,433.7 647.7,425.0 653.0,417.1 658.2,410.3 663.4,404.7 668.6,400.2 673.8,397.1 679.0,395.4 684.2,395.0 689.4,396.1 694.6,398.6 699.9,402.4 705.1,407.4 710.3,413.7 715.5,421.0 720.7,429.3 725.9,438.4 731.1,448.2 736.3,458.4 741.5,468.9 746.8,479.5 752.0,490.0 757.2,500.3 762.4,510.1 767.6,519.3 772.8,527.7 778.0,535.2 783.2,541.7 788.5,546.9 793.7,550.9 798.9,553.6 804.1,554.9 809.3,554.8 814.5,553.2 819.7,550.3 824.9,546.1 830.1,540.6 835.4,534.0 840.6,526.3 845.8,517.7 851.0,508.4 856.2,498.5 861.4,488.1 866.6,477.6 871.8,467.0 877.0,456.5 882.3,446.4 887.5,436.7 892.7,427.8 897.9,419.6 903.1,412.5 908.3,406.4 913.5,401.6 918.7,398.0 923.9,395.8 929.2,395.0 934.4,395.6 939.6,397.6 944.8,400.9 950.0,405.6" fill="none" stroke="#b91c1c" stroke-width="5"/><rect x="20" y="670" width="960" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="706" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">When prey are plentiful the predators have more young and their numbers rise, but only after the prey</text><text x="40" y="742" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">have already risen. More predators then eat more prey and the prey numbers fall; with fewer predators</text><text x="40" y="778" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">the prey recover, and the cycle repeats.</text><text x="40" y="820" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">Human activity changes the carrying capacity: clearing forest or overfishing lowers it, while irrigation,</text><text x="40" y="848" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">fertiliser and medicine can raise it.</text><rect x="20" y="880" width="960" height="110" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="500" y="910" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">No population grows that way for long: the limiting factors bite and the curve levels off.</text><text x="500" y="940" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">The population size at which it levels off is the carrying capacity of that habitat.</text><text x="500" y="970" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">The limiting factors are food, water, space, disease and predation.</text></svg>