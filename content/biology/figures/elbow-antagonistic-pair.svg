<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="1000" height="880" role="img"><title>The elbow flexed and extended, showing the biceps and the triceps as an antagonistic pair with their tendons and the ligament of the joint</title><rect x="0" y="0" width="1000" height="880" fill="#ffffff"/><defs><marker id="elbow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="elbow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker><marker id="elbow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="elbow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><text x="500" y="44" font-family="Helvetica,Arial,sans-serif" font-size="28" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">THE ELBOW: AN ANTAGONISTIC PAIR</text><rect x="20" y="90" width="470" height="510" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="255" y="130" font-family="Helvetica,Arial,sans-serif" font-size="24" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">TO FLEX</text><line x1="90" y1="300" x2="350" y2="300" stroke="#94a3b8" stroke-width="30" stroke-linecap="round"/><line x1="90" y1="300" x2="350" y2="300" stroke="#f8fafc" stroke-width="22" stroke-linecap="round"/><circle cx="365" cy="300" r="17" fill="#f8fafc" stroke="#475569" stroke-width="4"/><line x1="374" y1="294" x2="464" y2="174" stroke="#94a3b8" stroke-width="26" stroke-linecap="round"/><line x1="374" y1="294" x2="464" y2="174" stroke="#f8fafc" stroke-width="18" stroke-linecap="round"/><line x1="356" y1="306" x2="446" y2="186" stroke="#94a3b8" stroke-width="26" stroke-linecap="round"/><line x1="356" y1="306" x2="446" y2="186" stroke="#f8fafc" stroke-width="18" stroke-linecap="round"/><ellipse cx="215" cy="262" rx="88" ry="26" fill="#fda4af" stroke="#9f1239" stroke-width="3.5"/><ellipse cx="215" cy="340" rx="112" ry="16" fill="#fee2e2" stroke="#fda4af" stroke-width="2"/><line x1="128" y1="262" x2="96" y2="286" stroke="#64748b" stroke-width="16" stroke-linecap="round"/><line x1="128" y1="262" x2="96" y2="286" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/><line x1="302" y1="262" x2="378" y2="290" stroke="#64748b" stroke-width="16" stroke-linecap="round"/><line x1="302" y1="262" x2="378" y2="290" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/><line x1="104" y1="340" x2="92" y2="318" stroke="#64748b" stroke-width="16" stroke-linecap="round"/><line x1="104" y1="340" x2="92" y2="318" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/><line x1="326" y1="340" x2="368" y2="322" stroke="#64748b" stroke-width="16" stroke-linecap="round"/><line x1="326" y1="340" x2="368" y2="322" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/><line x1="384" y1="310" x2="410" y2="332" stroke="#64748b" stroke-width="14" stroke-linecap="round"/><line x1="384" y1="310" x2="410" y2="332" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/><text x="200" y="300" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">humerus</text><text x="215" y="224" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#b91c1c" font-weight="400" dominant-baseline="middle">biceps contracts</text><text x="215" y="378" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">triceps relaxes</text><rect x="510" y="90" width="470" height="510" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="745" y="130" font-family="Helvetica,Arial,sans-serif" font-size="24" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">TO EXTEND</text><line x1="580" y1="300" x2="840" y2="300" stroke="#94a3b8" stroke-width="30" stroke-linecap="round"/><line x1="580" y1="300" x2="840" y2="300" stroke="#f8fafc" stroke-width="22" stroke-linecap="round"/><circle cx="855" cy="300" r="17" fill="#f8fafc" stroke="#475569" stroke-width="4"/><line x1="864" y1="294" x2="954" y2="424" stroke="#94a3b8" stroke-width="26" stroke-linecap="round"/><line x1="864" y1="294" x2="954" y2="424" stroke="#f8fafc" stroke-width="18" stroke-linecap="round"/><line x1="846" y1="306" x2="936" y2="436" stroke="#94a3b8" stroke-width="26" stroke-linecap="round"/><line x1="846" y1="306" x2="936" y2="436" stroke="#f8fafc" stroke-width="18" stroke-linecap="round"/><ellipse cx="705" cy="262" rx="112" ry="16" fill="#fee2e2" stroke="#fda4af" stroke-width="2"/><ellipse cx="705" cy="340" rx="88" ry="26" fill="#fda4af" stroke="#9f1239" stroke-width="3.5"/><line x1="618" y1="262" x2="586" y2="286" stroke="#64748b" stroke-width="16" stroke-linecap="round"/><line x1="618" y1="262" x2="586" y2="286" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/><line x1="792" y1="262" x2="868" y2="290" stroke="#64748b" stroke-width="16" stroke-linecap="round"/><line x1="792" y1="262" x2="868" y2="290" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/><line x1="594" y1="340" x2="582" y2="318" stroke="#64748b" stroke-width="16" stroke-linecap="round"/><line x1="594" y1="340" x2="582" y2="318" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/><line x1="816" y1="340" x2="858" y2="322" stroke="#64748b" stroke-width="16" stroke-linecap="round"/><line x1="816" y1="340" x2="858" y2="322" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/><line x1="874" y1="310" x2="900" y2="332" stroke="#64748b" stroke-width="14" stroke-linecap="round"/><line x1="874" y1="310" x2="900" y2="332" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/><text x="690" y="300" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">humerus</text><text x="705" y="224" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">biceps relaxes</text><text x="705" y="378" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#b91c1c" font-weight="400" dominant-baseline="middle">triceps contracts</text><text x="470" y="160" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">radius</text><line x1="464" y1="160" x2="460" y2="190" stroke="#64748b" stroke-width="2"/><circle cx="460" cy="190" r="4.5" fill="#64748b"/><text x="430" y="140" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">ulna</text><line x1="424" y1="140" x2="444" y2="176" stroke="#64748b" stroke-width="2"/><circle cx="444" cy="176" r="4.5" fill="#64748b"/><text x="60" y="240" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">tendon</text><line x1="66" y1="240" x2="100" y2="278" stroke="#64748b" stroke-width="2"/><circle cx="100" cy="278" r="4.5" fill="#64748b"/><text x="432" y="400" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">ligament</text><line x1="426" y1="400" x2="406" y2="330" stroke="#64748b" stroke-width="2"/><circle cx="406" cy="330" r="4.5" fill="#64748b"/><text x="365" y="470" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">hinge joint</text><line x1="359" y1="470" x2="365" y2="322" stroke="#64748b" stroke-width="2"/><circle cx="365" cy="322" r="4.5" fill="#64748b"/><text x="900" y="250" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">tendon</text><line x1="906" y1="250" x2="852" y2="288" stroke="#64748b" stroke-width="2"/><circle cx="852" cy="288" r="4.5" fill="#64748b"/><rect x="20" y="630" width="960" height="210" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="662" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">An antagonistic pair: one muscle contracts while the other relaxes.</text><text x="40" y="698" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">A muscle can only pull, so the elbow needs two muscles, one pulling each way.</text><text x="40" y="734" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">A tendon joins muscle to bone; a ligament joins bone to bone.</text><text x="40" y="770" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">A hinge joint moves in one plane only.</text><text x="40" y="804" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">The upper arm has one bone, the humerus; the forearm has two, the radius and the ulna.</text></svg>