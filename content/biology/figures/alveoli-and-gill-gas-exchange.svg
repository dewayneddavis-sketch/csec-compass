<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 940" width="1000" height="940" role="img"><title>An alveolus with its wall one cell thick against a capillary carrying blood, and a gill with its filaments and one lamella in counter-current flow</title><rect x="0" y="0" width="1000" height="940" fill="#ffffff"/><defs><marker id="gas-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="gas-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker><marker id="gas-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="gas-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><text x="500" y="42" font-family="Helvetica,Arial,sans-serif" font-size="27" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">GAS EXCHANGE SURFACES</text><rect x="20" y="80" width="470" height="540" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="255" y="116" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">in the alveolus</text><rect x="32" y="140" width="96" height="34" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="80" y="158" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">trachea</text><line x1="130" y1="157" x2="146" y2="157" stroke="#475569" stroke-width="3" marker-end="url(#gas-arrow)"/><rect x="150" y="140" width="96" height="34" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="198" y="158" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">bronchi</text><line x1="248" y1="157" x2="264" y2="157" stroke="#475569" stroke-width="3" marker-end="url(#gas-arrow)"/><rect x="268" y="140" width="96" height="34" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="316" y="158" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">bronchioles</text><line x1="366" y1="157" x2="382" y2="157" stroke="#475569" stroke-width="3" marker-end="url(#gas-arrow)"/><rect x="386" y="140" width="96" height="34" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="434" y="158" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">alveoli</text><path d="M 130,470 A 120,120 0 0 1 370,470 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/><text x="250" y="380" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">air</text><rect x="130" y="470" width="240" height="9" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/><rect x="105" y="479" width="290" height="46" rx="23" fill="#fecdd3" stroke="#9f1239" stroke-width="3"/><text x="250" y="503" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#9f1239" font-weight="400" dominant-baseline="middle">blood</text><line x1="196" y1="444" x2="196" y2="496" stroke="#1d4ed8" stroke-width="4" marker-end="url(#gas-blue)"/><line x1="304" y1="496" x2="304" y2="444" stroke="#b91c1c" stroke-width="4" marker-end="url(#gas-red)"/><text x="250" y="560" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">oxygen in, carbon dioxide out</text><text x="470" y="320" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">moist lining</text><line x1="464" y1="320" x2="340" y2="422" stroke="#64748b" stroke-width="2"/><circle cx="340" cy="422" r="4.5" fill="#64748b"/><text x="470" y="408" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">wall one</text><text x="470" y="430" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">cell thick</text><line x1="462" y1="408" x2="372" y2="470" stroke="#64748b" stroke-width="2"/><circle cx="372" cy="470" r="4.5" fill="#64748b"/><text x="470" y="548" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">capillaries</text><line x1="464" y1="548" x2="330" y2="524" stroke="#64748b" stroke-width="2"/><circle cx="330" cy="524" r="4.5" fill="#64748b"/><text x="40" y="320" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">alveoli</text><line x1="46" y1="320" x2="176" y2="392" stroke="#64748b" stroke-width="2"/><circle cx="176" cy="392" r="4.5" fill="#64748b"/><rect x="510" y="80" width="470" height="540" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="745" y="116" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">in the gill: counter-current flow</text><path d="M 560,196 Q 730,158 900,196" fill="none" stroke="#94a3b8" stroke-width="16" stroke-linecap="round"/><rect x="578" y="186" width="17" height="112" rx="8" fill="#fecdd3" stroke="#9f1239" stroke-width="2.5"/><rect x="622" y="186" width="17" height="112" rx="8" fill="#fecdd3" stroke="#9f1239" stroke-width="2.5"/><rect x="666" y="186" width="17" height="112" rx="8" fill="#fecdd3" stroke="#9f1239" stroke-width="2.5"/><rect x="710" y="186" width="17" height="112" rx="8" fill="#fecdd3" stroke="#9f1239" stroke-width="2.5"/><rect x="754" y="186" width="17" height="112" rx="8" fill="#fecdd3" stroke="#9f1239" stroke-width="2.5"/><rect x="798" y="186" width="17" height="112" rx="8" fill="#fecdd3" stroke="#9f1239" stroke-width="2.5"/><rect x="842" y="186" width="17" height="112" rx="8" fill="#fecdd3" stroke="#9f1239" stroke-width="2.5"/><rect x="886" y="186" width="17" height="112" rx="8" fill="#fecdd3" stroke="#9f1239" stroke-width="2.5"/><text x="540" y="260" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">gill</text><line x1="546" y1="260" x2="566" y2="190" stroke="#64748b" stroke-width="2"/><circle cx="566" cy="190" r="4.5" fill="#64748b"/><text x="952" y="330" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">filaments</text><line x1="946" y1="330" x2="902" y2="286" stroke="#64748b" stroke-width="2"/><circle cx="902" cy="286" r="4.5" fill="#64748b"/><rect x="560" y="386" width="380" height="92" rx="16" fill="#fecdd3" stroke="#9f1239" stroke-width="3"/><rect x="572" y="404" width="356" height="56" rx="14" fill="#fee2e2" stroke="#9f1239" stroke-width="1.5"/><line x1="566" y1="356" x2="934" y2="356" stroke="#475569" stroke-width="4" marker-end="url(#gas-arrow)"/><text x="566" y="336" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">water</text><line x1="934" y1="432" x2="566" y2="432" stroke="#b91c1c" stroke-width="4" marker-end="url(#gas-red)"/><text x="620" y="416" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#9f1239" font-weight="400" dominant-baseline="middle">blood</text><text x="566" y="372" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">lamellae</text><line x1="572" y1="372" x2="604" y2="390" stroke="#64748b" stroke-width="2"/><circle cx="604" cy="390" r="4.5" fill="#64748b"/><text x="750" y="540" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">blood flows the other way</text><text x="750" y="572" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">counter-current flow: more oxygen is taken up</text><text x="750" y="600" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">than if the two flowed the same way</text><rect x="20" y="646" width="960" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="682" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">Oxygen diffuses from the air in the alveolus into the blood, and carbon dioxide diffuses from the blood</text><text x="40" y="716" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">into the alveolus to be breathed out. In the gill the water and the blood flow in the opposite direction.</text><text x="40" y="758" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">Every gas exchange surface must be thin, moist, with a large surface area and a good blood or air supply.</text><rect x="20" y="812" width="960" height="100" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="500" y="840" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">A thin surface keeps the diffusion path short, and a moist one is needed because gases have to dissolve,</text><text x="500" y="872" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">a large surface area so that a lot of gas can cross at once, and a good blood or air supply keeps</text><text x="500" y="898" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">the concentration gradient steep so that diffusion keeps going.</text></svg>