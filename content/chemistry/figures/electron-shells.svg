<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Electron shells for the first 20 elements, and what happens when they form ions"><title>Electron shells for the first 20 elements, and what happens when they form ions</title><desc>Shell diagrams drawn from each element's real atomic number using the 2, 8, 8, 2 capacity of the first four shells, plus the sodium and chloride ions.</desc><rect width="1600" height="1000" fill="#ffffff"/><text x="60" y="62" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="44" font-weight="800" fill="#111827">Shells, filled from the inside out</text><text x="60" y="98" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="28" fill="#475569">For the first 20 elements the shells fill 2, then 8, then 8, then 2 — so the configuration follows the atomic number.</text><rect x="60" y="160" width="280" height="272" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="200" cy="280" r="20" fill="#1e293b"/><circle cx="200" cy="280" r="34" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="200.0" cy="246.0" r="5.5" fill="#0e7490"/><text x="200" y="416" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#111827" text-anchor="middle">Hydrogen (H)</text><text x="200" y="444" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490" text-anchor="middle">1 electron — 1</text><rect x="380" y="160" width="280" height="272" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="520" cy="280" r="20" fill="#1e293b"/><circle cx="520" cy="280" r="34" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="520.0" cy="246.0" r="5.5" fill="#0e7490"/><circle cx="520.0" cy="314.0" r="5.5" fill="#0e7490"/><text x="520" y="416" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#111827" text-anchor="middle">Helium (He)</text><text x="520" y="444" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490" text-anchor="middle">2 electrons — 2</text><rect x="700" y="160" width="280" height="272" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="840" cy="280" r="20" fill="#1e293b"/><circle cx="840" cy="280" r="34" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="840.0" cy="246.0" r="5.5" fill="#0e7490"/><circle cx="840.0" cy="314.0" r="5.5" fill="#0e7490"/><circle cx="840" cy="280" r="59" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="840.0" cy="221.0" r="5.5" fill="#0e7490"/><text x="840" y="416" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#111827" text-anchor="middle">Lithium (Li)</text><text x="840" y="444" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490" text-anchor="middle">3 electrons — 2, 1</text><rect x="1020" y="160" width="280" height="272" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="1160" cy="280" r="20" fill="#1e293b"/><circle cx="1160" cy="280" r="34" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="1160.0" cy="246.0" r="5.5" fill="#0e7490"/><circle cx="1160.0" cy="314.0" r="5.5" fill="#0e7490"/><circle cx="1160" cy="280" r="59" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="1160.0" cy="221.0" r="5.5" fill="#0e7490"/><circle cx="1219.0" cy="280.0" r="5.5" fill="#0e7490"/><circle cx="1160.0" cy="339.0" r="5.5" fill="#0e7490"/><circle cx="1101.0" cy="280.0" r="5.5" fill="#0e7490"/><text x="1160" y="416" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#111827" text-anchor="middle">Carbon (C)</text><text x="1160" y="444" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490" text-anchor="middle">6 electrons — 2, 4</text><rect x="60" y="446" width="280" height="272" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="200" cy="566" r="20" fill="#1e293b"/><circle cx="200" cy="566" r="34" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="200.0" cy="532.0" r="5.5" fill="#0e7490"/><circle cx="200.0" cy="600.0" r="5.5" fill="#0e7490"/><circle cx="200" cy="566" r="59" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="200.0" cy="507.0" r="5.5" fill="#0e7490"/><circle cx="251.1" cy="536.5" r="5.5" fill="#0e7490"/><circle cx="251.1" cy="595.5" r="5.5" fill="#0e7490"/><circle cx="200.0" cy="625.0" r="5.5" fill="#0e7490"/><circle cx="148.9" cy="595.5" r="5.5" fill="#0e7490"/><circle cx="148.9" cy="536.5" r="5.5" fill="#0e7490"/><text x="200" y="702" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#111827" text-anchor="middle">Oxygen (O)</text><text x="200" y="730" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490" text-anchor="middle">8 electrons — 2, 6</text><rect x="380" y="446" width="280" height="272" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="520" cy="566" r="20" fill="#1e293b"/><circle cx="520" cy="566" r="34" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="520.0" cy="532.0" r="5.5" fill="#0e7490"/><circle cx="520.0" cy="600.0" r="5.5" fill="#0e7490"/><circle cx="520" cy="566" r="59" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="520.0" cy="507.0" r="5.5" fill="#0e7490"/><circle cx="561.7" cy="524.3" r="5.5" fill="#0e7490"/><circle cx="579.0" cy="566.0" r="5.5" fill="#0e7490"/><circle cx="561.7" cy="607.7" r="5.5" fill="#0e7490"/><circle cx="520.0" cy="625.0" r="5.5" fill="#0e7490"/><circle cx="478.3" cy="607.7" r="5.5" fill="#0e7490"/><circle cx="461.0" cy="566.0" r="5.5" fill="#0e7490"/><circle cx="478.3" cy="524.3" r="5.5" fill="#0e7490"/><circle cx="520" cy="566" r="84" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="520.0" cy="482.0" r="5.5" fill="#0e7490"/><text x="520" y="702" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#111827" text-anchor="middle">Sodium (Na)</text><text x="520" y="730" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490" text-anchor="middle">11 electrons — 2, 8, 1</text><rect x="700" y="446" width="280" height="272" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="840" cy="566" r="20" fill="#1e293b"/><circle cx="840" cy="566" r="34" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="840.0" cy="532.0" r="5.5" fill="#0e7490"/><circle cx="840.0" cy="600.0" r="5.5" fill="#0e7490"/><circle cx="840" cy="566" r="59" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="840.0" cy="507.0" r="5.5" fill="#0e7490"/><circle cx="881.7" cy="524.3" r="5.5" fill="#0e7490"/><circle cx="899.0" cy="566.0" r="5.5" fill="#0e7490"/><circle cx="881.7" cy="607.7" r="5.5" fill="#0e7490"/><circle cx="840.0" cy="625.0" r="5.5" fill="#0e7490"/><circle cx="798.3" cy="607.7" r="5.5" fill="#0e7490"/><circle cx="781.0" cy="566.0" r="5.5" fill="#0e7490"/><circle cx="798.3" cy="524.3" r="5.5" fill="#0e7490"/><circle cx="840" cy="566" r="84" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="840.0" cy="482.0" r="5.5" fill="#0e7490"/><circle cx="905.7" cy="513.6" r="5.5" fill="#0e7490"/><circle cx="921.9" cy="584.7" r="5.5" fill="#0e7490"/><circle cx="876.4" cy="641.7" r="5.5" fill="#0e7490"/><circle cx="803.6" cy="641.7" r="5.5" fill="#0e7490"/><circle cx="758.1" cy="584.7" r="5.5" fill="#0e7490"/><circle cx="774.3" cy="513.6" r="5.5" fill="#0e7490"/><text x="840" y="702" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#111827" text-anchor="middle">Chlorine (Cl)</text><text x="840" y="730" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490" text-anchor="middle">17 electrons — 2, 8, 7</text><rect x="1020" y="446" width="280" height="272" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="1160" cy="566" r="20" fill="#1e293b"/><circle cx="1160" cy="566" r="34" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="1160.0" cy="532.0" r="5.5" fill="#0e7490"/><circle cx="1160.0" cy="600.0" r="5.5" fill="#0e7490"/><circle cx="1160" cy="566" r="59" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="1160.0" cy="507.0" r="5.5" fill="#0e7490"/><circle cx="1201.7" cy="524.3" r="5.5" fill="#0e7490"/><circle cx="1219.0" cy="566.0" r="5.5" fill="#0e7490"/><circle cx="1201.7" cy="607.7" r="5.5" fill="#0e7490"/><circle cx="1160.0" cy="625.0" r="5.5" fill="#0e7490"/><circle cx="1118.3" cy="607.7" r="5.5" fill="#0e7490"/><circle cx="1101.0" cy="566.0" r="5.5" fill="#0e7490"/><circle cx="1118.3" cy="524.3" r="5.5" fill="#0e7490"/><circle cx="1160" cy="566" r="84" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="1160.0" cy="482.0" r="5.5" fill="#0e7490"/><circle cx="1219.4" cy="506.6" r="5.5" fill="#0e7490"/><circle cx="1244.0" cy="566.0" r="5.5" fill="#0e7490"/><circle cx="1219.4" cy="625.4" r="5.5" fill="#0e7490"/><circle cx="1160.0" cy="650.0" r="5.5" fill="#0e7490"/><circle cx="1100.6" cy="625.4" r="5.5" fill="#0e7490"/><circle cx="1076.0" cy="566.0" r="5.5" fill="#0e7490"/><circle cx="1100.6" cy="506.6" r="5.5" fill="#0e7490"/><circle cx="1160" cy="566" r="109" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="1160.0" cy="457.0" r="5.5" fill="#0e7490"/><circle cx="1160.0" cy="675.0" r="5.5" fill="#0e7490"/><text x="1160" y="702" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#111827" text-anchor="middle">Calcium (Ca)</text><text x="1160" y="730" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490" text-anchor="middle">20 electrons — 2, 8, 8, 2</text><rect x="60" y="744" width="1480" height="132" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="88" y="774" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#111827">The same rule for all of the first 20 elements</text><text x="92" y="806" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">1 H</text><text x="92" y="828" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">1</text><text x="238" y="806" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">2 He</text><text x="238" y="828" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2</text><text x="384" y="806" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">3 Li</text><text x="384" y="828" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 1</text><text x="530" y="806" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">4 Be</text><text x="530" y="828" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 2</text><text x="676" y="806" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">5 B</text><text x="676" y="828" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 3</text><text x="822" y="806" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">6 C</text><text x="822" y="828" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 4</text><text x="968" y="806" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">7 N</text><text x="968" y="828" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 5</text><text x="1114" y="806" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">8 O</text><text x="1114" y="828" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 6</text><text x="1260" y="806" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">9 F</text><text x="1260" y="828" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 7</text><text x="1406" y="806" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">10 Ne</text><text x="1406" y="828" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 8</text><text x="92" y="848" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">11 Na</text><text x="92" y="870" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 8, 1</text><text x="238" y="848" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">12 Mg</text><text x="238" y="870" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 8, 2</text><text x="384" y="848" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">13 Al</text><text x="384" y="870" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 8, 3</text><text x="530" y="848" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">14 Si</text><text x="530" y="870" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 8, 4</text><text x="676" y="848" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">15 P</text><text x="676" y="870" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 8, 5</text><text x="822" y="848" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">16 S</text><text x="822" y="870" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 8, 6</text><text x="968" y="848" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">17 Cl</text><text x="968" y="870" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 8, 7</text><text x="1114" y="848" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">18 Ar</text><text x="1114" y="870" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 8, 8</text><text x="1260" y="848" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">19 K</text><text x="1260" y="870" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 8, 8, 1</text><text x="1406" y="848" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827">20 Ca</text><text x="1406" y="870" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">2, 8, 8, 2</text><rect x="60" y="890" width="1480" height="104" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="88" y="920" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="27" font-weight="800" fill="#111827">Losing or gaining electrons makes an ion</text><text x="88" y="952" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" fill="#475569">Sodium (2, 8, 1) loses its single outer electron and becomes Na⁺ (2, 8).</text><text x="88" y="982" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" fill="#475569">Chlorine (2, 8, 7) gains one and becomes Cl⁻ (2, 8, 8) — both then have a full outer shell.</text></svg>