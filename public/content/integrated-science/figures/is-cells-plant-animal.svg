cy="800" r="4.5" fill="#64748b"/><rect x="20" y="1118" width="960" height="100" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="1148" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">A typical plant or animal cell has a cell membrane,</text><text x="40" y="1176" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">cytoplasm and genetic material. Plant cells also have</text><text x="40" y="1204" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">a cellulose cell wall, a large vacuole and chloroplasts.</text><text x="20" y="1248" font-family="Helvetica,Arial,sans-serif" font-size="26" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">HOW SUBSTANCES MOVE IN AND OUT OF CELLS</text><rect x="20" y="1272" width="306" height="224" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="36" y="1302" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">DIFFUSION</text><rect x="40" y="1324" width="266" height="86" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="58" cy="1344" r="6" fill="#1d4ed8"/><circle cx="74" cy="1344" r="6" fill="#1d4ed8"/><circle cx="90" cy="1344" r="6" fill="#1d4ed8"/><circle cx="58" cy="1368" r="6" fill="#1d4ed8"/><circle cx="74" cy="1368" r="6" fill="#1d4ed8"/><circle cx="90" cy="1368" r="6" fill="#1d4ed8"/><circle cx="58" cy="1392" r="6" fill="#1d4ed8"/><circle cx="74" cy="1392" r="6" fill="#1d4ed8"/><circle cx="90" cy="1392" r="6" fill="#1d4ed8"/><circle cx="246" cy="1358" r="6" fill="#1d4ed8"/><circle cx="260" cy="1384" r="6" fill="#1d4ed8"/><circle cx="274" cy="1358" r="6" fill="#1d4ed8"/><line x1="138" y1="1367" x2="220" y2="1367" stroke="#b91c1c" stroke-width="2.5"/><line x1="220.0" y1="1367.0" x2="209.0" y2="1371.9" stroke="#b91c1c" stroke-width="2.5"/><line x1="220.0" y1="1367.0" x2="209.0" y2="1362.1" stroke="#b91c1c" stroke-width="2.5"/><text x="36" y="1432" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">particles spread from a high</text><text x="36" y="1456" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">to a low concentration</text><rect x="347" y="1272" width="306" height="224" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="363" y="1302" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">OSMOSIS</text><rect x="367" y="1324" width="266" height="98" rx="10" fill="#eff6ff" stroke="#cbd5e1" stroke-width="2"/><line x1="500" y1="1356" x2="500" y2="1420" stroke="#334155" stroke-width="3" stroke-dasharray="9 6"/><circle cx="391" cy="1376" r="6" fill="#1d4ed8"/><circle cx="427" cy="1408" r="6" fill="#1d4ed8"/><circle cx="465" cy="1376" r="6" fill="#1d4ed8"/><circle cx="543" cy="1376" r="6" fill="#1d4ed8"/><circle cx="583" cy="1408" r="6" fill="#1d4ed8"/><circle cx="561" cy="1380" r="7" fill="#ea580c"/><circle cx="599" cy="1376" r="7" fill="#ea580c"/><circle cx="615" cy="1408" r="7" fill="#ea580c"/><line x1="443" y1="1392" x2="475" y2="1392" stroke="#b91c1c" stroke-width="2.5"/><line x1="475.0" y1="1392.0" x2="465.9" y2="1396.1" stroke="#b91c1c" stroke-width="2.5"/><line x1="475.0" y1="1392.0" x2="465.9" y2="1387.9" stroke="#b91c1c" stroke-width="2.5"/><text x="373" y="1342" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">dilute</text><text x="627" y="1342" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="end" fill="#475569" font-weight="400" dominant-baseline="middle">more concentrated</text><text x="363" y="1432" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">the movement of water across</text><text x="363" y="1456" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">a partially permeable membrane</text><rect x="674" y="1272" width="306" height="224" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="690" y="1302" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">ACTIVE TRANSPORT</text><rect x="694" y="1324" width="266" height="86" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><circle cx="720" cy="1352" r="6" fill="#1d4ed8"/><circle cx="736" cy="1384" r="6" fill="#1d4ed8"/><circle cx="870" cy="1344" r="6" fill="#1d4ed8"/><circle cx="890" cy="1384" r="6" fill="#1d4ed8"/><circle cx="914" cy="1352" r="6" fill="#1d4ed8"/><circle cx="936" cy="1384" r="6" fill="#1d4ed8"/><line x1="766" y1="1368" x2="852" y2="1368" stroke="#b91c1c" stroke-width="2.5"/><line x1="852.0" y1="1368.0" x2="841.0" y2="1372.9" stroke="#b91c1c" stroke-width="2.5"/><line x1="852.0" y1="1368.0" x2="841.0" y2="1363.1" stroke="#b91c1c" stroke-width="2.5"/><text x="690" y="1432" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">against the gradient</text><text x="690" y="1456" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">requires energy from respiration</text><text x="20" y="1530" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">Plant cells become turgid in fresh water and flaccid in salty water</text>Plant cells become turgid in fresh water and flaccid in salty water</svg>