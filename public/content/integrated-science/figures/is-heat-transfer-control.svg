<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 930" width="1000" height="930" role="img"><title>Four panels: conduction along a metal bar, convection in a fluid, radiation crossing space, and a thermos flask cutaway</title><rect x="0" y="0" width="1000" height="930" fill="#ffffff"/><rect x="20" y="74" width="470" height="400" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="108" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">CONDUCTION</text><line x1="70" y1="324" x2="420" y2="324" stroke="#e5e7eb" stroke-width="2"/><defs><linearGradient id="is-bar" x1="0" x2="1"><stop offset="0%" stop-color="#fca5a5"/><stop offset="100%" stop-color="#dbeafe"/></linearGradient></defs><rect x="70" y="204" width="350" height="76" rx="10" fill="url(#is-bar)" stroke="#64748b" stroke-width="2.5"/><circle cx="96" cy="242" r="7" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><path d="M 83,230 q 13,-9 26,0" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/><path d="M 109,255 q -13,9 -26,0" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/><circle cx="146" cy="242" r="7" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><path d="M 133,230 q 13,-9 26,0" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/><path d="M 159,255 q -13,9 -26,0" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/><circle cx="196" cy="242" r="7" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><path d="M 183,230 q 13,-9 26,0" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/><path d="M 209,255 q -13,9 -26,0" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/><circle cx="246" cy="242" r="7" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><path d="M 233,230 q 13,-9 26,0" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/><path d="M 259,255 q -13,9 -26,0" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/><circle cx="296" cy="242" r="7" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><circle cx="346" cy="242" r="7" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><circle cx="396" cy="242" r="7" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><circle cx="160" cy="264" r="5" fill="#1d4ed8"/><circle cx="270" cy="264" r="5" fill="#1d4ed8"/><circle cx="360" cy="264" r="5" fill="#1d4ed8"/><line x1="80" y1="182" x2="220" y2="182" stroke="#ea580c" stroke-width="2.5"/><line x1="220.0" y1="182.0" x2="209.0" y2="186.9" stroke="#ea580c" stroke-width="2.5"/><line x1="220.0" y1="182.0" x2="209.0" y2="177.1" stroke="#ea580c" stroke-width="2.5"/><text x="230" y="182" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="start" fill="#ea580c" font-weight="600" dominant-baseline="middle">energy</text><text x="70" y="170" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">hot</text><text x="420" y="170" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="end" fill="#475569" font-weight="400" dominant-baseline="middle">cold</text><text x="70" y="306" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">metal</text><text x="40" y="362" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">energy passes through a material by particle</text><text x="40" y="387" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">vibration and free electrons; metals are</text><text x="40" y="412" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">good conductors</text><text x="40" y="436" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">air, wood and plastic are poor ones</text><rect x="510" y="74" width="470" height="400" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="530" y="108" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">CONVECTION</text><rect x="650" y="194" width="190" height="180" rx="8" fill="#fff" stroke="#64748b" stroke-width="2.5"/><rect x="653" y="196" width="184" height="176" fill="#dbeafe"/><path d="M 685,346 C 662,306 662,260 695,230" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/><line x1="695.0" y1="230.0" x2="698.6" y2="241.4" stroke="#ea580c" stroke-width="2.5"/><line x1="695.0" y1="230.0" x2="688.9" y2="240.3" stroke="#ea580c" stroke-width="2.5"/><path d="M 805,230 C 838,260 838,306 805,346" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/><line x1="805.0" y1="346.0" x2="801.4" y2="334.5" stroke="#1d4ed8" stroke-width="2.5"/><line x1="805.0" y1="346.0" x2="811.1" y2="335.7" stroke="#1d4ed8" stroke-width="2.5"/><text x="642" y="274" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="end" fill="#ea580c" font-weight="600" dominant-baseline="middle">rises</text><text x="854" y="274" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="start" fill="#1d4ed8" font-weight="600" dominant-baseline="middle">sinks</text><text x="530" y="404" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">warmed liquid or gas expands, becomes</text><text x="530" y="429" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">less dense and rises, then cools and</text><text x="530" y="454" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">sinks</text><rect x="20" y="504" width="470" height="400" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="538" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">RADIATION</text><circle cx="115" cy="689" r="46" fill="#fbbf24" stroke="#d97706" stroke-width="3"/><line x1="171.0" y1="689.0" x2="187.0" y2="689.0" stroke="#d97706" stroke-width="3"/><line x1="154.6" y1="728.6" x2="165.9" y2="739.9" stroke="#d97706" stroke-width="3"/><line x1="115.0" y1="745.0" x2="115.0" y2="761.0" stroke="#d97706" stroke-width="3"/><line x1="75.4" y1="728.6" x2="64.1" y2="739.9" stroke="#d97706" stroke-width="3"/><line x1="59.0" y1="689.0" x2="43.0" y2="689.0" stroke="#d97706" stroke-width="3"/><line x1="75.4" y1="649.4" x2="64.1" y2="638.1" stroke="#d97706" stroke-width="3"/><line x1="115.0" y1="633.0" x2="115.0" y2="617.0" stroke="#d97706" stroke-width="3"/><line x1="154.6" y1="649.4" x2="165.9" y2="638.1" stroke="#d97706" stroke-width="3"/><path d="M 200.0,652.0 L 205.0,656.9 L 210.0,660.7 L 215.1,662.8 L 220.1,662.6 L 225.1,660.2 L 230.1,656.1 L 235.2,651.2 L 240.2,646.4 L 245.2,642.8 L 250.2,641.1 L 255.3,641.6 L 260.3,644.4 L 265.3,648.7 L 270.3,653.7 L 275.4,658.3 L 280.4,661.7 L 285.4,663.0 L 290.4,662.0 L 295.5,659.0 L 300.5,654.5 L 305.5,649.5 L 310.5,645.0 L 315.6,642.0 L 320.6,641.0 L 325.6,642.3 L 330.6,645.7 L 335.7,650.3 L 340.7,655.3 L 345.7,659.6 L 350.7,662.4 L 355.8,662.9 L 360.8,661.2 L 365.8,657.6 L 370.8,652.8 L 375.9,647.9 L 380.9,643.8 L 385.9,641.4 L 390.9,641.2 L 396.0,643.3 L 401.0,647.1 L 406.0,652.0" fill="none" stroke="#1d4ed8" stroke-width="2.5"/><path d="M 200.0,678.0 L 205.0,682.9 L 210.0,686.7 L 215.1,688.8 L 220.1,688.6 L 225.1,686.2 L 230.1,682.1 L 235.2,677.2 L 240.2,672.4 L 245.2,668.8 L 250.2,667.1 L 255.3,667.6 L 260.3,670.4 L 265.3,674.7 L 270.3,679.7 L 275.4,684.3 L 280.4,687.7 L 285.4,689.0 L 290.4,688.0 L 295.5,685.0 L 300.5,680.5 L 305.5,675.5 L 310.5,671.0 L 315.6,668.0 L 320.6,667.0 L 325.6,668.3 L 330.6,671.7 L 335.7,676.3 L 340.7,681.3 L 345.7,685.6 L 350.7,688.4 L 355.8,688.9 L 360.8,687.2 L 365.8,683.6 L 370.8,678.8 L 375.9,673.9 L 380.9,669.8 L 385.9,667.4 L 390.9,667.2 L 396.0,669.3 L 401.0,673.1 L 406.0,678.0" fill="none" stroke="#1d4ed8" stroke-width="2.5"/><path d="M 200.0,704.0 L 205.0,708.9 L 210.0,712.7 L 215.1,714.8 L 220.1,714.6 L 225.1,712.2 L 230.1,708.1 L 235.2,703.2 L 240.2,698.4 L 245.2,694.8 L 250.2,693.1 L 255.3,693.6 L 260.3,696.4 L 265.3,700.7 L 270.3,705.7 L 275.4,710.3 L 280.4,713.7 L 285.4,715.0 L 290.4,714.0 L 295.5,711.0 L 300.5,706.5 L 305.5,701.5 L 310.5,697.0 L 315.6,694.0 L 320.6,693.0 L 325.6,694.3 L 330.6,697.7 L 335.7,702.3 L 340.7,707.3 L 345.7,711.6 L 350.7,714.4 L 355.8,714.9 L 360.8,713.2 L 365.8,709.6 L 370.8,704.8 L 375.9,699.9 L 380.9,695.8 L 385.9,693.4 L 390.9,693.2 L 396.0,695.3 L 401.0,699.1 L 406.0,704.0" fill="none" stroke="#1d4ed8" stroke-width="2.5"/><path d="M 200.0,730.0 L 205.0,734.9 L 210.0,738.7 L 215.1,740.8 L 220.1,740.6 L 225.1,738.2 L 230.1,734.1 L 235.2,729.2 L 240.2,724.4 L 245.2,720.8 L 250.2,719.1 L 255.3,719.6 L 260.3,722.4 L 265.3,726.7 L 270.3,731.7 L 275.4,736.3 L 280.4,739.7 L 285.4,741.0 L 290.4,740.0 L 295.5,737.0 L 300.5,732.5 L 305.5,727.5 L 310.5,723.0 L 315.6,720.0 L 320.6,719.0 L 325.6,720.3 L 330.6,723.7 L 335.7,728.3 L 340.7,733.3 L 345.7,737.6 L 350.7,740.4 L 355.8,740.9 L 360.8,739.2 L 365.8,735.6 L 370.8,730.8 L 375.9,725.9 L 380.9,721.8 L 385.9,719.4 L 390.9,719.2 L 396.0,721.3 L 401.0,725.1 L 406.0,730.0" fill="none" stroke="#1d4ed8" stroke-width="2.5"/><text x="50" y="766" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">the Sun</text><rect x="416" y="624" width="22" height="130" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5"/><text x="420" y="608" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="end" fill="#1d4ed8" font-weight="600" dominant-baseline="middle">electromagnetic waves</text><text x="40" y="792" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">radiation transfers energy by</text><text x="40" y="817" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">electromagnetic waves and needs</text><text x="40" y="842" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">no medium at all, which is why</text><text x="40" y="867" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">the Sun's heat reaches us through space</text><rect x="510" y="504" width="470" height="400" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="530" y="538" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">THERMOS FLASK</text><rect x="760" y="600" width="130" height="204" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><rect x="778" y="624" width="94" height="168" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2.5"/><rect x="780" y="704" width="90" height="86" rx="6" fill="#bae6fd"/><line x1="760" y1="634" x2="778" y2="634" stroke="#64748b" stroke-width="1.6"/><line x1="872" y1="634" x2="890" y2="634" stroke="#64748b" stroke-width="1.6"/><line x1="760" y1="650" x2="778" y2="650" stroke="#64748b" stroke-width="1.6"/><line x1="872" y1="650" x2="890" y2="650" stroke="#64748b" stroke-width="1.6"/><line x1="760" y1="666" x2="778" y2="666" stroke="#64748b" stroke-width="1.6"/><line x1="872" y1="666" x2="890" y2="666" stroke="#64748b" stroke-width="1.6"/><line x1="760" y1="682" x2="778" y2="682" stroke="#64748b" stroke-width="1.6"/><line x1="872" y1="682" x2="890" y2="682" stroke="#64748b" stroke-width="1.6"/><line x1="760" y1="698" x2="778" y2="698" stroke="#64748b" stroke-width="1.6"/><line x1="872" y1="698" x2="890" y2="698" stroke="#64748b" stroke-width="1.6"/><line x1="760" y1="714" x2="778" y2="714" stroke="#64748b" stroke-width="1.6"/><line x1="872" y1="714" x2="890" y2="714" stroke="#64748b" stroke-width="1.6"/><line x1="760" y1="730" x2="778" y2="730" stroke="#64748b" stroke-width="1.6"/><line x1="872" y1="730" x2="890" y2="730" stroke="#64748b" stroke-width="1.6"/><line x1="760" y1="746" x2="778" y2="746" stroke="#64748b" stroke-width="1.6"/><line x1="872" y1="746" x2="890" y2="746" stroke="#64748b" stroke-width="1.6"/><line x1="760" y1="762" x2="778" y2="762" stroke="#64748b" stroke-width="1.6"/><line x1="872" y1="762" x2="890" y2="762" stroke="#64748b" stroke-width="1.6"/><line x1="760" y1="778" x2="778" y2="778" stroke="#64748b" stroke-width="1.6"/><line x1="872" y1="778" x2="890" y2="778" stroke="#64748b" stroke-width="1.6"/><rect x="778" y="590" width="94" height="34" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2.5"/><text x="746" y="608" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">stopper</text><line x1="740" y1="608" x2="778" y2="608" stroke="#64748b" stroke-width="2"/><circle cx="778" cy="608" r="4.5" fill="#64748b"/><text x="746" y="734" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">silvered surfaces</text><line x1="740" y1="734" x2="778" y2="734" stroke="#64748b" stroke-width="2"/><circle cx="778" cy="734" r="4.5" fill="#64748b"/><text x="902" y="674" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">vacuum</text><line x1="908" y1="674" x2="886" y2="674" stroke="#64748b" stroke-width="2"/><circle cx="886" cy="674" r="4.5" fill="#64748b"/><text x="530" y="824" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">a thermos flask combines a vacuum,</text><text x="530" y="849" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">silvered surfaces and a stopper</text><text x="530" y="874" font-family="Helvetica,Arial,sans-serif" font-size="15.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">to block all three mechanisms</text></svg>