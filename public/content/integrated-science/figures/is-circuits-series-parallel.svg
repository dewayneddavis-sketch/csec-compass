<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 656" width="780" height="656" role="img"><title>A series circuit and a parallel circuit, a key of the symbols used, and the safety devices that protect a household circuit</title><rect x="0" y="0" width="780" height="656" fill="#ffffff"/><rect x="30" y="74" width="350" height="268" rx="12" fill="none" stroke="#374151" stroke-width="2.5"/><text x="30" y="50" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">Series circuit</text><text x="30" y="67" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#4b5563" font-weight="400" dominant-baseline="middle">the same current at every point</text><line x1="92" y1="176" x2="158" y2="176" stroke="#374151" stroke-width="2.5"/><line x1="190" y1="176" x2="318" y2="176" stroke="#374151" stroke-width="2.5"/><line x1="92" y1="262" x2="190" y2="262" stroke="#374151" stroke-width="2.5"/><line x1="222" y1="262" x2="318" y2="262" stroke="#374151" stroke-width="2.5"/><line x1="92" y1="176" x2="92" y2="210" stroke="#374151" stroke-width="2.5"/><line x1="92" y1="229" x2="92" y2="262" stroke="#374151" stroke-width="2.5"/><line x1="318" y1="176" x2="318" y2="262" stroke="#374151" stroke-width="2.5"/><line x1="73" y1="214" x2="111" y2="214" stroke="#111827" stroke-width="3"/><line x1="82" y1="225" x2="102" y2="225" stroke="#111827" stroke-width="6"/><rect x="140" y="163" width="52" height="26" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="166" y="181" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#111827" font-weight="600" dominant-baseline="middle">A</text><rect x="230" y="163" width="52" height="26" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="256" y="181" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#111827" font-weight="600" dominant-baseline="middle">B</text><circle cx="190" cy="262" r="3.5" fill="#111827" stroke="none"/><circle cx="222" cy="262" r="3.5" fill="#111827" stroke="none"/><line x1="190" y1="262" x2="218" y2="242" stroke="#111827" stroke-width="2.5"/><line x1="120" y1="176" x2="140" y2="176" stroke="#b91c1c" stroke-width="2.5"/><line x1="140.0" y1="176.0" x2="130.9" y2="180.1" stroke="#b91c1c" stroke-width="2.5"/><line x1="140.0" y1="176.0" x2="130.9" y2="171.9" stroke="#b91c1c" stroke-width="2.5"/><line x1="240" y1="262" x2="220" y2="262" stroke="#b91c1c" stroke-width="2.5"/><line x1="220.0" y1="262.0" x2="229.1" y2="257.9" stroke="#b91c1c" stroke-width="2.5"/><line x1="220.0" y1="262.0" x2="229.1" y2="266.1" stroke="#b91c1c" stroke-width="2.5"/><text x="120" y="150" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#b91c1c" font-weight="600" dominant-baseline="middle">current</text><text x="44" y="314" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#111827" font-weight="400" dominant-baseline="middle">the current is the same at every point</text><text x="44" y="332" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#111827" font-weight="400" dominant-baseline="middle">the voltage is shared between components</text><rect x="410" y="74" width="340" height="268" rx="12" fill="none" stroke="#374151" stroke-width="2.5"/><text x="410" y="50" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">Parallel circuit</text><text x="410" y="67" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#4b5563" font-weight="400" dominant-baseline="middle">components sit on separate branches</text><line x1="490" y1="178" x2="506" y2="178" stroke="#374151" stroke-width="2.5"/><line x1="538" y1="178" x2="700" y2="178" stroke="#374151" stroke-width="2.5"/><line x1="490" y1="262" x2="700" y2="262" stroke="#374151" stroke-width="2.5"/><line x1="490" y1="178" x2="490" y2="211" stroke="#374151" stroke-width="2.5"/><line x1="490" y1="230" x2="490" y2="262" stroke="#374151" stroke-width="2.5"/><line x1="700" y1="178" x2="700" y2="262" stroke="#374151" stroke-width="2.5"/><line x1="471" y1="215" x2="509" y2="215" stroke="#111827" stroke-width="3"/><line x1="480" y1="226" x2="500" y2="226" stroke="#111827" stroke-width="6"/><circle cx="506" cy="178" r="3.5" fill="#111827" stroke="none"/><circle cx="538" cy="178" r="3.5" fill="#111827" stroke="none"/><line x1="506" y1="178" x2="534" y2="158" stroke="#111827" stroke-width="2.5"/><line x1="560" y1="178" x2="560" y2="262" stroke="#374151" stroke-width="2.5"/><rect x="547" y="194" width="26" height="52" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="560" y="225" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#111827" font-weight="600" dominant-baseline="middle">A</text><line x1="650" y1="178" x2="650" y2="262" stroke="#374151" stroke-width="2.5"/><rect x="637" y="194" width="26" height="52" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="650" y="225" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#111827" font-weight="600" dominant-baseline="middle">B</text><line x1="600" y1="178" x2="640" y2="178" stroke="#b91c1c" stroke-width="2.5"/><line x1="640.0" y1="178.0" x2="630.9" y2="182.1" stroke="#b91c1c" stroke-width="2.5"/><line x1="640.0" y1="178.0" x2="630.9" y2="173.9" stroke="#b91c1c" stroke-width="2.5"/><text x="690" y="154" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="end" fill="#b91c1c" font-weight="600" dominant-baseline="middle">current</text><text x="424" y="314" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#111827" font-weight="400" dominant-baseline="middle">each receives the full voltage</text><text x="424" y="332" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" fill="#111827" font-weight="400" dominant-baseline="middle">the currents add up, and one branch can fail</text><line x1="30" y1="372" x2="750" y2="372" stroke="#e5e7eb" stroke-width="2"/><text x="30" y="398" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">Circuit symbols used above</text><line x1="66" y1="406" x2="66" y2="418" stroke="#374151" stroke-width="2.5"/><line x1="47" y1="419" x2="85" y2="419" stroke="#111827" stroke-width="3"/><line x1="56" y1="430" x2="76" y2="430" stroke="#111827" stroke-width="6"/><line x1="66" y1="436" x2="66" y2="448" stroke="#374151" stroke-width="2.5"/><text x="110" y="426" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">source</text><line x1="46" y1="478" x2="86" y2="478" stroke="#374151" stroke-width="2.5"/><text x="110" y="478" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">connecting wire</text><line x1="46" y1="526" x2="60" y2="526" stroke="#374151" stroke-width="2.5"/><circle cx="60" cy="526" r="3.5" fill="#111827" stroke="none"/><circle cx="92" cy="526" r="3.5" fill="#111827" stroke="none"/><line x1="60" y1="526" x2="88" y2="506" stroke="#111827" stroke-width="2.5"/><line x1="92" y1="526" x2="106" y2="526" stroke="#374151" stroke-width="2.5"/><text x="110" y="526" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">switch</text><rect x="54" y="563" width="52" height="26" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="80" y="581" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#111827" font-weight="600" dominant-baseline="middle">A</text><text x="118" y="576" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">component</text><text x="410" y="398" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">Safety devices and habits</text><line x1="410" y1="424" x2="430" y2="424" stroke="#374151" stroke-width="2.5"/><rect x="430" y="414" width="34" height="20" rx="3" fill="#fff" stroke="#111827" stroke-width="2.5"/><line x1="430" y1="424" x2="464" y2="424" stroke="#111827" stroke-width="2"/><line x1="464" y1="424" x2="484" y2="424" stroke="#374151" stroke-width="2.5"/><text x="498" y="424" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">fuse</text><rect x="410" y="466" width="44" height="30" rx="5" fill="#fff" stroke="#111827" stroke-width="2.5"/><line x1="454" y1="481" x2="508" y2="481" stroke="#15803d" stroke-width="2.5"/><line x1="508" y1="481" x2="508" y2="492" stroke="#15803d" stroke-width="2.5"/><line x1="494" y1="492" x2="522" y2="492" stroke="#15803d" stroke-width="2.5"/><line x1="500" y1="499" x2="516" y2="499" stroke="#15803d" stroke-width="2.5"/><line x1="505" y1="506" x2="511" y2="506" stroke="#15803d" stroke-width="2.5"/><text x="534" y="481" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">earth wire</text><rect x="410" y="520" width="46" height="32" rx="6" fill="#fff" stroke="#111827" stroke-width="2.5"/><line x1="456" y1="520" x2="470" y2="520" stroke="#111827" stroke-width="2.5"/><line x1="456" y1="528" x2="470" y2="528" stroke="#111827" stroke-width="2.5"/><line x1="456" y1="536" x2="470" y2="536" stroke="#111827" stroke-width="2.5"/><rect x="492" y="518" width="52" height="36" rx="6" fill="#fff" stroke="#111827" stroke-width="2.5"/><line x1="492" y1="520" x2="500" y2="520" stroke="#374151" stroke-width="2.5"/><line x1="492" y1="528" x2="500" y2="528" stroke="#374151" stroke-width="2.5"/><line x1="492" y1="536" x2="500" y2="536" stroke="#374151" stroke-width="2.5"/><text x="556" y="536" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">plugs and sockets</text><text x="30" y="598" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">Insulation, fuses and circuit breakers, earth wires, correct plugs and sockets.</text><text x="30" y="616" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">A simple circuit needs a source, connecting wires, a component and a switch.</text><text x="30" y="634" font-family="Helvetica,Arial,sans-serif" font-size="13.5" text-anchor="start" fill="#4b5563" font-weight="400" dominant-baseline="middle">no water near sockets, and never overloading an outlet</text></svg>