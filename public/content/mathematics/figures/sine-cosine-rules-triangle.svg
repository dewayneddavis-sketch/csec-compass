<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img">
<title>A triangle labelled a, b, c and A, B, C with the included angle A marked between sides b and c, and the Sine Rule, the Cosine Rule and the lesson's worked example written beside it</title>
<polygon points="261.934,138.511 140.000,400.000 332.000,400.000" fill="rgba(29,78,216,0.10)" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round"/><path d="M272.287,177.148 A40,40 0 0 1 245.030,174.763" fill="none" stroke="#b91c1c" stroke-width="3"/><path d="M159.018,359.216 A45,45 0 0 1 185.000,400.000" fill="none" stroke="#111827" stroke-width="2"/><path d="M287.000,400.000 A45,45 0 0 1 320.353,356.533" fill="none" stroke="#111827" stroke-width="2"/><text x="256.9342663187841" y="197.51112203211204" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#b91c1c" font-weight="600" text-anchor="middle">A</text><text x="191" y="372" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600" text-anchor="middle">B</text><text x="284" y="368" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600" text-anchor="middle">C</text><text x="236" y="424" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600" text-anchor="middle">a</text><text x="318" y="266" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600">b</text><text x="180" y="262" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600" text-anchor="end">c</text><text x="430" y="140" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600">The Sine Rule</text><text x="430" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">a/sin A = b/sin B = c/sin C</text><text x="430" y="206" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600">The Cosine Rule</text><text x="430" y="238" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">a² = b² + c² − 2bc cos A</text><text x="430" y="264" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#b91c1c">A is the angle between sides b and c</text><text x="430" y="306" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600">Worked example</text><text x="430" y="334" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">A = 40°, B = 65°, a = 8 cm</text><text x="430" y="360" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1d4ed8">b = 8 × sin 65° ÷ sin 40° = 11.28 cm</text><text x="430" y="396" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#4b5563">use the pair you know and the pair you want</text><text x="40" y="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600">Sine and Cosine Rules</text><text x="40" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4b5563">two sides and the angle between them: the Cosine Rule</text>
</svg>
