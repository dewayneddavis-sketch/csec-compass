<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" role="img">
<title>Readings taken from an ogive of 40 students' marks: cumulative frequency 10 at 44 marks, 20 at 52 marks and 30 at 61 marks, plotted as three points with their reading lines and no curve drawn through them</title>
<line x1="130" y1="470" x2="130" y2="110" stroke="#374151" stroke-width="2.5"/><line x1="130" y1="470" x2="600" y2="470" stroke="#374151" stroke-width="2.5"/><text x="40" y="88" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#4b5563">cumulative</text><text x="40" y="106" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#4b5563">frequency</text><text x="365" y="530" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="600" text-anchor="middle">marks</text><text x="122" y="368.61764705882354" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="end">10</text><text x="268.2352941176471" y="492" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">44</text><text x="122" y="262.7352941176471" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="end">20</text><text x="378.8235294117647" y="492" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">52</text><text x="122" y="156.8529411764706" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="end">30</text><text x="503.235294117647" y="492" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#4b5563" text-anchor="middle">61</text><line x1="130" y1="364.11764705882354" x2="268.2352941176471" y2="364.11764705882354" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="6 4"/><line x1="268.2352941176471" y1="364.11764705882354" x2="268.2352941176471" y2="470" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="6 4"/><circle cx="268.2352941176471" cy="364.11764705882354" r="5" fill="#1d4ed8" stroke="#111827" stroke-width="1.5"/><text x="256.2352941176471" y="352.11764705882354" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="600" text-anchor="end">Q1 = 44 marks</text><line x1="130" y1="258.2352941176471" x2="378.8235294117647" y2="258.2352941176471" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="6 4"/><line x1="378.8235294117647" y1="258.2352941176471" x2="378.8235294117647" y2="470" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="6 4"/><circle cx="378.8235294117647" cy="258.2352941176471" r="5" fill="#1d4ed8" stroke="#111827" stroke-width="1.5"/><text x="366.8235294117647" y="246.23529411764707" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="600" text-anchor="end">median = 52 marks</text><line x1="130" y1="152.3529411764706" x2="503.235294117647" y2="152.3529411764706" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="6 4"/><line x1="503.235294117647" y1="152.3529411764706" x2="503.235294117647" y2="470" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="6 4"/><circle cx="503.235294117647" cy="152.3529411764706" r="5" fill="#1d4ed8" stroke="#111827" stroke-width="1.5"/><text x="515.2352941176471" y="140.3529411764706" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="600">Q3 = 61 marks</text><text x="630" y="196" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="600">reading the quartiles</text><text x="630" y="228" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">interquartile range</text><text x="630" y="250" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="600">= 61 − 44 = 17 marks</text><text x="630" y="282" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" 