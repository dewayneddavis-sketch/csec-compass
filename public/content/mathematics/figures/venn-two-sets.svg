<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 480" width="660" height="480" role="img">
<title>A two-set Venn diagram: 40 students, 25 play cricket, 18 play football, 10 play both</title>
<polyline points="40.000,64.000 600.000,64.000 600.000,384.000 40.000,384.000 40.000,64.000" fill="none" stroke="#374151" stroke-width="2.5"/><circle cx="250" cy="240" r="118" fill="rgba(29,78,216,0.10)" stroke="#1d4ed8" stroke-width="2.5"/><circle cx="390" cy="240" r="118" fill="rgba(21,128,61,0.12)" stroke="#15803d" stroke-width="2.5"/><text x="200" y="247" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#1d4ed8" font-weight="600" text-anchor="middle">15</text><text x="320" y="247" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#111827" font-weight="600" text-anchor="middle">10</text><text x="440" y="247" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#15803d" font-weight="600" text-anchor="middle">8</text><text x="556" y="344" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#4b5563" font-weight="600" text-anchor="middle">7</text><text x="250" y="106" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#1d4ed8" font-weight="600" text-anchor="middle">C</text><text x="390" y="106" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#15803d" font-weight="600" text-anchor="middle">F</text><text x="56" y="90" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600">ξ</text><text x="40" y="414" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#4b5563">C only = 25 − 10,  F only = 18 − 10,  neither = the rest of the 40</text><text x="40" y="440" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600">15 + 10 + 8 + 7 = 40</text><text x="40" y="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600">Two sets inside the universal set ξ</text><text x="40" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4b5563">write the overlap first, then the two ‘only’ regions, then the ‘neither’ region</text>
</svg>
