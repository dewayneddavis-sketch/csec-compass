<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img">
<title>A pie chart of 60 students' marks in the classes 0-9, 10-19, 20-29 and 30-39, with frequencies 8, 22, 20 and 10 and sector angles 48, 132, 120 and 60 degrees</title>
<path d="M240,320 L240.000,145.000 A175,175 0 0 1 370.050,202.902 Z" fill="rgba(29,78,216,0.10)" stroke="none"/><line x1="240" y1="320" x2="240" y2="145" stroke="#1d4ed8" stroke-width="2"/><path d="M240.000,145.000 A175,175 0 0 1 370.050,202.902" fill="none" stroke="#1d4ed8" stroke-width="2"/><text x="284.1309257737243" y="220.88031784577782" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">0–9</text><text x="284.1309257737243" y="240.88031784577782" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#111827" font-weight="600" text-anchor="middle">8</text><path d="M240,320 L370.050,202.902 A175,175 0 0 1 240.000,495.000 Z" fill="rgba(21,128,61,0.12)" stroke="none"/><line x1="240" y1="320" x2="370.05034445854403" y2="202.90214388719983" stroke="#15803d" stroke-width="2"/><path d="M370.050,202.902 A175,175 0 0 1 240.000,495.000" fill="none" stroke="#15803d" stroke-width="2"/><text x="339.1196821542222" y="364.1309257737243" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#15803d" font-weight="600" text-anchor="middle">10–19</text><text x="339.1196821542222" y="384.1309257737243" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#111827" font-weight="600" text-anchor="middle">22</text><path d="M240,320 L240.000,495.000 A175,175 0 0 1 88.446,232.500 Z" fill="rgba(185,28,28,0.10)" stroke="none"/><line x1="240" y1="320" x2="240" y2="495" stroke="#b91c1c" stroke-width="2"/><path d="M240.000,495.000 A175,175 0 0 1 88.446,232.500" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="146.0362436893884" y="374.25" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#b91c1c" font-weight="600" text-anchor="middle">20–29</text><text x="146.0362436893884" y="394.25" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#111827" font-weight="600" text-anchor="middle">20</text><path d="M240,320 L88.446,232.500 A175,175 0 0 1 240.000,145.000 Z" fill="rgba(75,85,99,0.10)" stroke="none"/><line x1="240" y1="320" x2="88.44555433772325" y2="232.5" stroke="#4b5563" stroke-width="2"/><path d="M88.446,232.500 A175,175 0 0 1 240.000,145.000" fill="none" stroke="#4b5563" stroke-width="2"/><text x="185.74999999999994" y="226.0362436893884" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#4b5563" font-weight="600" text-anchor="middle">30–39</text><text x="185.74999999999994" y="246.0362436893884" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#111827" font-weight="600" text-anchor="middle">10</text><text x="470" y="120" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600">Worked method — 60 students' marks</text><text x="470" y="152" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827">8 + 22 + 20 + 10 = 60</text><text x="470" y="182" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1d4ed8">(8 ÷ 60) × 360° = 48°</text><text x="470" y="212" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#15803d">(22 ÷ 60) × 360° = 132°</text><text x="470" y="242" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#b91c1c">(20 ÷ 60) × 360° = 120°</text><text x="470" y="272" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#4b5563">(10 ÷ 60) × 360° = 60°</text><text x="470" y="302" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827" font-weight="600">48 + 132 + 120 + 60 = 360°, so the angles are correct</text><text x="470" y="336" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#111827">8 ÷ 60 = 0.133 = 13.3%, the share of the 0–9 class</text><text x="470" y="372" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#4b5563">class and frequency, not relative frequency</text><text x="40" y="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600">A pie chart of 60 students' marks</text><text x="40" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4b5563">the angle of a sector is (frequency ÷ total) × 360°</text>
</svg>
