<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img">
<title>A ship's course from P on a bearing of 070 degrees for 8 km to Q, then 130 degrees for 6 km to R, with a north line at P and at Q, the interior angle at Q of 120 degrees and PR worked out as 12.17 km</title>
<line x1="170" y1="330" x2="170" y2="158" stroke="#374151" stroke-width="2"/><polyline points="166.000,166.000 170.000,158.000 174.000,166.000" fill="none" stroke="#374151" stroke-width="2"/><line x1="425.59639285376704" y1="236.9705210154181" x2="425.59639285376704" y2="80" stroke="#374151" stroke-width="2"/><polyline points="421.596,88.000 425.596,80.000 429.596,88.000" fill="none" stroke="#374151" stroke-width="2"/><line x1="170" y1="330" x2="425.59639285376704" y2="236.9705210154181" stroke="#1d4ed8" stroke-width="2.5"/><line x1="425.59639285376704" y1="236.9705210154181" x2="581.8694592500385" y2="368.0991933914721" stroke="#1d4ed8" stroke-width="2.5"/><line x1="170" y1="330" x2="581.8694592500385" y2="368.0991933914721" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5"/><path d="M170.000,260.000 A70,70 0 0 1 235.778,306.059" fill="none" stroke="#b91c1c" stroke-width="2.5"/><path d="M425.596,166.971 A70,70 0 0 1 479.220,281.966" fill="none" stroke="#b91c1c" stroke-width="2.5"/><path d="M460.834,266.539 A46,46 0 0 1 382.371,252.703" fill="none" stroke="#15803d" stroke-width="2.5"/><circle cx="170" cy="330" r="5" fill="#111827" stroke="none"/><circle cx="425.59639285376704" cy="236.9705210154181" r="5" fill="#111827" stroke="none"/><circle cx="581.8694592500385" cy="368.0991933914721" r="5" fill="#111827" stroke="none"/><text x="170" y="148" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#4b5563" font-weight="600" text-anchor="middle">N</text><text x="425.59639285376704" y="70" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#4b5563" font-weight="600" text-anchor="middle">N</text><text x="156" y="338" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600" text-anchor="end">P</text><text x="433.59639285376704" y="226.9705210154181" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600">Q</text><text x="591.8694592500385" y="374.0991933914721" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600">R</text><text x="223" y="259" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#b91c1c" font-weight="600" text-anchor="middle">070°</text><text x="512" y="201" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#b91c1c" font-weight="600" text-anchor="middle">130°</text><text x="412" y="318" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13.5" fill="#15803d" font-weight="600" text-anchor="middle">120°</text><text x="290" y="265" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1d4ed8" font-weight="600" text-anchor="middle">8 km</text><text x="519" y="289" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#1d4ed8" font-weight="600" text-anchor="middle">6 km</text><text x="376" y="372" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#b91c1c" font-weight="600" text-anchor="middle">PR = 12.17 km</text><text x="600" y="140" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#111827" font-weight="600">Worked example</text><text x="600" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">P to Q: 8 km on a bearing of 070°</text><text x="600" y="198" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">Q to R: 6 km on a bearing of 130°</text><text x="600" y="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">the back bearing of 070° is 250°</text><text x="600" y="256" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#15803d">interior angle at Q: 250° − 130° = 120°</text><text x="600" y="288" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">PR² = 8² + 6² − 2 × 8 × 6 × cos 120°</text><text x="600" y="314" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">= 64 + 36 + 48 = 148</text><text x="600" y="340" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="600">PR = 12.17 km</text><text x="40" y="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600">Bearings: north lines and the clockwise angle</text><text x="40" y="52" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4b5563">a three-figure bearing is measured clockwise from north</text>
</svg>
