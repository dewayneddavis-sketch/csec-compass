" repeatCount="indefinite"/></circle><circle id="projectile" cx="300.000" cy="190.000" r="9" fill="rgba(185,28,28,0.10)" stroke="#b91c1c" stroke-width="3"><animate attributeName="cx" values="300.000;339.000;378.000;417.000;456.000;495.000;534.000" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333;1.0000" dur="1.5s" repeatCount="indefinite"/><animate attributeName="cy" values="190.000;196.500;216.000;248.500;294.000;352.500;424.000" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333;1.0000" dur="1.5s" repeatCount="indefinite"/></circle><circle cx="300.000" cy="190.000" r="3.4" fill="#1d4ed8"/><circle cx="339.000" cy="196.500" r="3.4" fill="#1d4ed8"/><circle cx="378.000" cy="216.000" r="3.4" fill="#1d4ed8"/><circle cx="417.000" cy="248.500" r="3.4" fill="#1d4ed8"/><circle cx="456.000" cy="294.000" r="3.4" fill="#1d4ed8"/><circle cx="495.000" cy="352.500" r="3.4" fill="#1d4ed8"/><circle cx="534.000" cy="424.000" r="3.4" fill="#1d4ed8"/><line x1="310" y1="168" x2="400" y2="168" stroke="#b91c1c" stroke-width="2.2"/><path d="M406,168 l-12,-5.5 v11 z" fill="#b91c1c"/><text x="410" y="154" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="600">horizontal velocity: constant —</text><text x="410" y="172" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#b91c1c">a straight distance-time line</text><line x1="568" y1="250" x2="568" y2="400" stroke="#b91c1c" stroke-width="2.5"/><path d="M568,404 l-5,-10 h10 z" fill="#b91c1c"/><text x="772" y="296" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="600" text-anchor="end">vertical velocity increases —</text><text x="772" y="314" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#b91c1c" text-anchor="end">a curving distance-time line:</text><text x="772" y="332" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#b91c1c" text-anchor="end">the acceleration of free fall</text><text x="316" y="292" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="600">the second ball</text><text x="316" y="310" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1d4ed8">is released at</text><text x="316" y="328" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1d4ed8">the same instant</text><text x="316" y="346" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1d4ed8">and lands with it.</text><text x="40" y="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600">A ball projected horizontally from a table edge</text><text x="40" y="54" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4b5563">constant velocity across, the acceleration of free fall down — so the path is a parabola</text><text x="40" y="452" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">The dots mark equal time intervals: the ball moves the same 0.30 m across in each one, but falls 0.05 m,</text><text x="40" y="474" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">then 0.20 m, 0.45 m, 0.80 m, 1.25 m and 1.80 m — the same growing drop as a ball released from rest,</text><text x="40" y="496" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">so the two balls land together. Drawn from y = g x² / (2 v²) with g = 10 N/kg, v = 3 m/s, table 1.80 m high.</text>
</svg>
