ke="#15803d" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="30" y1="220" x2="60" y2="220" stroke="#15803d" stroke-width="1.2" stroke-dasharray="4 4"/><text x="30" y="190" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#15803d" font-weight="600" text-anchor="end">A</text><line x1="101.25" y1="296" x2="101.25" y2="346" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="266.25" y1="296" x2="266.25" y2="346" stroke="#4b5563" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="101.25" y1="342" x2="266.25" y2="342" stroke="#1d4ed8" stroke-width="1.8"/><path d="M99,342 l9,-4.5 v9 z" fill="#1d4ed8"/><path d="M268.5,342 l-9,-4.5 v9 z" fill="#1d4ed8"/><text x="183.75" y="370" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">λ = one wavelength (crest to crest)</text><line x1="430" y1="88" x2="612" y2="88" stroke="#b91c1c" stroke-width="2.2"/><path d="M620,88 l-12,-5.5 v11 z" fill="#b91c1c"/><text x="525" y="76" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="600" text-anchor="middle">direction of energy travel</text><text x="636" y="314" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="600" text-anchor="middle">the marked particle</text><text x="636" y="332" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="600" text-anchor="middle">moves only up and down</text><text x="40" y="34" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600">A transverse wave travelling to the right</text><text x="40" y="54" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4b5563">crests, troughs, amplitude, wavelength — and one particle that only moves up and down</text><text x="40" y="400" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">The dashed horizontal line is the rest position — where the particles sit when no wave is passing.</text><text x="40" y="422" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">A is the amplitude: the height of a crest above the rest position, never the trough-to-crest height.</text><text x="40" y="444" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">The particles vibrate perpendicular to the direction the wave travels; it carries energy, not matter.</text><text x="40" y="466" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">The train moves on by exactly one wavelength λ every period T, which is why v = fλ and f = 1/T.</text>
</svg>
