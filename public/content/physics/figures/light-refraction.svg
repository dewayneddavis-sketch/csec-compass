<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="780" height="480" role="img">
<title>Refraction at an air-glass boundary, and the two lens shapes</title>
<rect x="40" y="236" width="350" height="126" fill="rgba(29,78,216,0.07)"/><line x1="40" y1="236" x2="390" y2="236" stroke="#374151" stroke-width="2.5"/><text x="52" y="224" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#4b5563">air</text><text x="52" y="266" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#4b5563">glass, n = 1.5</text><line x1="210" y1="374" x2="210" y2="98" stroke="#4b5563" stroke-width="2" stroke-dasharray="7 5"/><text x="219" y="114" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#4b5563">normal</text><line x1="110.98533880877933" y1="148.70683377727795" x2="210" y2="236" stroke="#1d4ed8" stroke-width="3"/><path d="M141.95,167.33 L148.61,181.88 L133.34,177.09" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="30.985338808779332" y="126.70683377727795" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="600">incident ray</text><line x1="210" y1="236" x2="270.72" y2="341.17012503558226" stroke="#b91c1c" stroke-width="3"/><path d="M256.90,304.22 L258.58,320.14 L245.63,310.73" fill="none" stroke="#b91c1c" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="282.72" y="353.17012503558226" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="600">refracted ray</text><path d="M210,174 A62,62 0 0 0 163.4931136829115,194.9986643499336" fill="none" stroke="#1d4ed8" stroke-width="2"/><path d="M210,298 A62,62 0 0 0 241,289.6935750346352" fill="none" stroke="#b91c1c" stroke-width="2"/><text x="90" y="198" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#1d4ed8" font-weight="600">i = 48.6&#176;</text><line x1="284" y1="270" x2="232" y2="292" stroke="#b91c1c" stroke-width="1.5"/><text x="288" y="266" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#b91c1c" font-weight="600">r = 30&#176;</text><text x="52" y="310" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827">closer to the normal:</text><text x="52" y="327" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827">the light slows and bends</text><text x="52" y="344" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#111827">toward it</text><text x="40" y="44" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#111827" font-weight="600">Refraction at a boundary</text><text x="40" y="62" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#4b5563">n = sin i / sin r = 1.5 for the angles drawn here</text><line x1="470" y1="150" x2="700" y2="150" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M587,98 Q626,150 587,202 Q548,150 587,98 Z" fill="rgba(29,78,216,0.10)" stroke="#111827" stroke-width="2.5"/><line x1="526" y1="117" x2="590" y2="117" stroke="#1d4ed8" stroke-width="2"/><line x1="606" y1="117" x2="696" y2="150" stroke="#b91c1c" stroke-width="2"/><line x1="526" y1="134" x2="590" y2="134" stroke="#1d4ed8" stroke-width="2"/><line x1="606" y1="134" x2="696" y2="150" stroke="#b91c1c" stroke-width="2"/><line x1="526" y1="166" x2="590" y2="166" stroke="#1d4ed8" stroke-width="2"/><line x1="606" y1="166" x2="696" y2="150" stroke="#b91c1c" stroke-width="2"/><line x1="526" y1="183" x2="590" y2="183" stroke="#1d4ed8" stroke-width="2"/><line x1="606" y1="183" x2="696" y2="150" stroke="#b91c1c" stroke-width="2"/><circle cx="696" cy="150" r="4" fill="#111827"/><text x="470" y="88" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827" font-weight="600">converging (convex) lens</text><text x="662" y="184" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827">focal point</text><text x="470" y="228" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4b5563">parallel rays brought together at the focal point</text><line x1="470" y1="356" x2="700" y2="356" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M591,304 Q616,356 591,408 L609,408 Q584,356 609,304 Z" fill="rgba(29,78,216,0.10)" stroke="#111827" stroke-width="2.5"/><line x1="526" y1="323" x2="590" y2="323" stroke="#1d4ed8" stroke-width="2"/><line x1="606" y1="323" x2="696" y2="290" stroke="#b91c1c" stroke-width="2"/><line x1="526" y1="340" x2="590" y2="340" stroke="#1d4ed8" stroke-width="2"/><line x1="606" y1="340" x2="696" y2="324" stroke="#b91c1c" stroke-width="2"/><line x1="526" y1="372" x2="590" y2="372" stroke="#1d4ed8" stroke-width="2"/><line x1="606" y1="372" x2="696" y2="388" stroke="#b91c1c" stroke-width="2"/><line x1="526" y1="389" x2="590" y2="389" stroke="#1d4ed8" stroke-width="2"/><line x1="606" y1="389" x2="696" y2="422" stroke="#b91c1c" stroke-width="2"/><text x="470" y="276" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#111827" font-weight="600">diverging (concave) lens</text><text x="470" y="434" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#4b5563">the rays spread apart, so the image is virtual</text><line x1="470" y1="252" x2="770" y2="252" stroke="#e5e7eb" stroke-width="2"/>
</svg>
