<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Atomic structure: subatomic particles, atomic number, mass number and isotopes"><title>Atomic structure: subatomic particles, atomic number, mass number and isotopes</title><desc>A labelled sodium atom with its nucleus and three shells, the definitions of atomic number and mass number, and isotopes of carbon drawn from real data.</desc><rect width="1600" height="1000" fill="#ffffff"/><text x="60" y="62" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="44" font-weight="800" fill="#111827">Inside the atom</text><text x="60" y="98" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="28" fill="#475569">Protons and neutrons sit in the nucleus; electrons occupy shells around it.</text><rect x="60" y="130" width="700" height="806" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="410" cy="500" r="38" fill="#1e293b"/><text x="410" y="496" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">11 p⁺</text><text x="410" y="515" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">12 n⁰</text><circle cx="410" cy="500" r="76" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="410.0" cy="424.0" r="6.5" fill="#0e7490"/><circle cx="410.0" cy="576.0" r="6.5" fill="#0e7490"/><circle cx="410" cy="500" r="142" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="410.0" cy="358.0" r="6.5" fill="#0e7490"/><circle cx="510.4" cy="399.6" r="6.5" fill="#0e7490"/><circle cx="552.0" cy="500.0" r="6.5" fill="#0e7490"/><circle cx="510.4" cy="600.4" r="6.5" fill="#0e7490"/><circle cx="410.0" cy="642.0" r="6.5" fill="#0e7490"/><circle cx="309.6" cy="600.4" r="6.5" fill="#0e7490"/><circle cx="268.0" cy="500.0" r="6.5" fill="#0e7490"/><circle cx="309.6" cy="399.6" r="6.5" fill="#0e7490"/><circle cx="410" cy="500" r="208" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="410.0" cy="292.0" r="6.5" fill="#0e7490"/><text x="410" y="200" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#111827" text-anchor="middle">Sodium atom — Z = 11, A = 23</text><line x1="410" y1="424" x2="410" y2="398" stroke="#475569" stroke-width="1.5"/><text x="410" y="390" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="22" fill="#111827" text-anchor="middle">shell 1: 2 electrons (holds up to 2)</text><line x1="410" y1="358" x2="410" y2="332" stroke="#475569" stroke-width="1.5"/><text x="410" y="324" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="22" fill="#111827" text-anchor="middle">shell 2: 8 electrons (holds up to 8)</text><line x1="410" y1="292" x2="410" y2="266" stroke="#475569" stroke-width="1.5"/><text x="410" y="258" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="22" fill="#111827" text-anchor="middle">shell 3: 1 electron (holds up to 8) — the valence shell</text><text x="90" y="912" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">Configuration written shell by shell: 2, 8, 1 — read from the inside out.</text><rect x="790" y="130" width="750" height="100" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="820" y="168" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#0e7490">Atomic number (Z)</text><text x="820" y="202" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="27" fill="#475569">The number of protons in the nucleus. Sodium: Z = 11.</text><rect x="790" y="248" width="750" height="100" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="820" y="286" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#0e7490">Mass number (A)</text><text x="820" y="320" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="27" fill="#475569">Protons + neutrons, counted together. Sodium: 11 + 12 = A = 23.</text><rect x="790" y="366" width="750" height="100" rx="14" fill="#ffffff" stroke="#cbd5e1"/><text x="820" y="404" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#0e7490">Neutral atom</text><text x="820" y="438" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="27" fill="#475569">Electrons = protons, so the charges cancel. Sodium: 11 = 11.</text><rect x="790" y="486" width="750" height="450" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="820" y="522" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="28" font-weight="800" fill="#111827">Isotopes of carbon</text><text x="820" y="552" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">same atomic number, different mass number</text><circle cx="910" cy="650" r="24" fill="#1e293b"/><text x="910" y="646" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">6 p⁺</text><text x="910" y="665" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">6 n⁰</text><circle cx="910" cy="650" r="48" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="910.0" cy="602.0" r="6" fill="#0e7490"/><circle cx="910.0" cy="698.0" r="6" fill="#0e7490"/><circle cx="910" cy="650" r="86" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="910.0" cy="564.0" r="6" fill="#0e7490"/><circle cx="996.0" cy="650.0" r="6" fill="#0e7490"/><circle cx="910.0" cy="736.0" r="6" fill="#0e7490"/><circle cx="824.0" cy="650.0" r="6" fill="#0e7490"/><text x="910" y="782" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="middle">carbon-12</text><text x="910" y="806" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="21" fill="#475569" text-anchor="middle">6 p, 6 n</text><circle cx="1145" cy="650" r="24" fill="#1e293b"/><text x="1145" y="646" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">6 p⁺</text><text x="1145" y="665" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">7 n⁰</text><circle cx="1145" cy="650" r="48" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="1145.0" cy="602.0" r="6" fill="#0e7490"/><circle cx="1145.0" cy="698.0" r="6" fill="#0e7490"/><circle cx="1145" cy="650" r="86" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="1145.0" cy="564.0" r="6" fill="#0e7490"/><circle cx="1231.0" cy="650.0" r="6" fill="#0e7490"/><circle cx="1145.0" cy="736.0" r="6" fill="#0e7490"/><circle cx="1059.0" cy="650.0" r="6" fill="#0e7490"/><text x="1145" y="782" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="middle">carbon-13</text><text x="1145" y="806" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="21" fill="#475569" text-anchor="middle">6 p, 7 n</text><circle cx="1380" cy="650" r="24" fill="#1e293b"/><text x="1380" y="646" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">6 p⁺</text><text x="1380" y="665" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">8 n⁰</text><circle cx="1380" cy="650" r="48" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="1380.0" cy="602.0" r="6" fill="#0e7490"/><circle cx="1380.0" cy="698.0" r="6" fill="#0e7490"/><circle cx="1380" cy="650" r="86" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="1380.0" cy="564.0" r="6" fill="#0e7490"/><circle cx="1466.0" cy="650.0" r="6" fill="#0e7490"/><circle cx="1380.0" cy="736.0" r="6" fill="#0e7490"/><circle cx="1294.0" cy="650.0" r="6" fill="#0e7490"/><text x="1380" y="782" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="middle">carbon-14</text><text x="1380" y="806" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="21" fill="#475569" text-anchor="middle">6 p, 8 n</text><text x="820" y="836" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">All three are carbon: each has 6 protons. Only the</text><text x="820" y="862" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#475569">neutron count changes, so the mass number changes too.</text><text x="820" y="898" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490">Drawn from real atomic data — sodium: 11 protons, 12 neutrons.</text></svg>