<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Electron shells for the first 20 elements, and what happens when they form ions"><title>Electron shells for the first 20 elements, and what happens when they form ions</title><desc>Shell diagrams drawn from each element's real atomic number using the 2, 8, 8, 2 capacity of the first four shells, plus the sodium and chloride ions.</desc><rect width="1600" height="1000" fill="#ffffff"/><text x="60" y="62" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="44" font-weight="800" fill="#111827">Shells, filled from the inside out</text><text x="60" y="98" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="28" fill="#475569">For the first 20 elements the shells fill 2, then 8, then 8, then 2 — so the configuration follows the atomic number.</text><rect x="60" y="170" width="280" height="272" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="200" cy="290" r="20" fill="#1e293b"/><circle cx="200" cy="290" r="34" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="200.0" cy="256.0" r="5.5" fill="#0e7490"/><text x="200" y="426" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#111827" text-anchor="middle">Hydrogen (H)</text><text x="200" y="454" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490" text-anchor="middle">1 electron — 1</text><rect x="380" y="170" width="280" height="272" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="520" cy="290" r="20" fill="#1e293b"/><circle cx="520" cy="290" r="34" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="520.0" cy="256.0" r="5.5" fill="#0e7490"/><circle cx="520.0" cy="324.0" r="5.5" fill="#0e7490"/><text x="520" y="426" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#111827" text-anchor="middle">Helium (He)</text><text x="520" y="454" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490" text-anchor="middle">2 electrons — 2</text><rect x="700" y="170" width="280" height="272" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="840" cy="290" r="20" fill="#1e293b"/><circle cx="840" cy="290" r="34" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="840.0" cy="256.0" r="5.5" fill="#0e7490"/><circle cx="840.0" cy="324.0" r="5.5" fill="#0e7490"/><circle cx="840" cy="290" r="59" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="840.0" cy="231.0" r="5.5" fill="#0e7490"/><text x="840" y="426" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#111827" text-anchor="middle">Lithium (Li)</text><text x="840" y="454" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490" text-anchor="middle">3 electrons — 2, 1</text><rect x="1020" y="170" width="280" height="272" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="1160" cy="290" r="20" fill="#1e293b"/><circle cx="1160" cy="290" r="34" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="1160.0" cy="256.0" r="5.5" fill="#0e7490"/><circle cx="1160.0" cy="324.0" r="5.5" fill="#0e7490"/><circle cx="1160" cy="290" r="59" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="1160.0" cy="231.0" r="5.5" fill="#0e7490"/><circle cx="1219.0" cy="290.0" r="5.5" fill="#0e7490"/><circle cx="1160.0" cy="349.0" r="5.5" fill="#0e7490"/><circle cx="1101.0" cy="290.0" r="5.5" fill="#0e7490"/><text x="1160" y="426" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#111827" text-anchor="middle">Carbon (C)</text><text x="1160" y="454" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490" text-anchor="middle">6 electrons — 2, 4</text><rect x="60" y="470" width="280" height="272" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="200" cy="590" r="20" fill="#1e293b"/><circle cx="200" cy="590" r="34" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="200.0" cy="556.0" r="5.5" fill="#0e7490"/><circle cx="200.0" cy="624.0" r="5.5" fill="#0e7490"/><circle cx="200" cy="590" r="59" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="200.0" cy="531.0" r="5.5" fill="#0e7490"/><circle cx="251.1" cy="560.5" r="5.5" fill="#0e7490"/><circle cx="251.1" cy="619.5" r="5.5" fill="#0e7490"/><circle cx="200.0" cy="649.0" r="5.5" fill="#0e7490"/><circle cx="148.9" cy="619.5" r="5.5" fill="#0e7490"/><circle cx="148.9" cy="560.5" r="5.5" fill="#0e7490"/><text x="200" y="726" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#111827" text-anchor="middle">Oxygen (O)</text><text x="200" y="754" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490" text-anchor="middle">8 electrons — 2, 6</text><rect x="380" y="470" width="280" height="272" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="520" cy="590" r="20" fill="#1e293b"/><circle cx="520" cy="590" r="34" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="520.0" cy="556.0" r="5.5" fill="#0e7490"/><circle cx="520.0" cy="624.0" r="5.5" fill="#0e7490"/><circle cx="520" cy="590" r="59" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="520.0" cy="531.0" r="5.5" fill="#0e7490"/><circle cx="561.7" cy="548.3" r="5.5" fill="#0e7490"/><circle cx="579.0" cy="590.0" r="5.5" fill="#0e7490"/><circle cx="561.7" cy="631.7" r="5.5" fill="#0e7490"/><circle cx="520.0" cy="649.0" r="5.5" fill="#0e7490"/><circle cx="478.3" cy="631.7" r="5.5" fill="#0e7490"/><circle cx="461.0" cy="590.0" r="5.5" fill="#0e7490"/><circle cx="478.3" cy="548.3" r="5.5" fill="#0e7490"/><circle cx="520" cy="590" r="84" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="520.0" cy="506.0" r="5.5" fill="#0e7490"/><text x="520" y="726" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#111827" text-anchor="middle">Sodium (Na)</text><text x="520" y="754" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490" text-anchor="middle">11 electrons — 2, 8, 1</text><rect x="700" y="470" width="280" height="272" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="840" cy="590" r="20" fill="#1e293b"/><circle cx="840" cy="590" r="34" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="840.0" cy="556.0" r="5.5" fill="#0e7490"/><circle cx="840.0" cy="624.0" r="5.5" fill="#0e7490"/><circle cx="840" cy="590" r="59" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="840.0" cy="531.0" r="5.5" fill="#0e7490"/><circle cx="881.7" cy="548.3" r="5.5" fill="#0e7490"/><circle cx="899.0" cy="590.0" r="5.5" fill="#0e7490"/><circle cx="881.7" cy="631.7" r="5.5" fill="#0e7490"/><circle cx="840.0" cy="649.0" r="5.5" fill="#0e7490"/><circle cx="798.3" cy="631.7" r="5.5" fill="#0e7490"/><circle cx="781.0" cy="590.0" r="5.5" fill="#0e7490"/><circle cx="798.3" cy="548.3" r="5.5" fill="#0e7490"/><circle cx="840" cy="590" r="84" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="840.0" cy="506.0" r="5.5" fill="#0e7490"/><circle cx="905.7" cy="537.6" r="5.5" fill="#0e7490"/><circle cx="921.9" cy="608.7" r="5.5" fill="#0e7490"/><circle cx="876.4" cy="665.7" r="5.5" fill="#0e7490"/><circle cx="803.6" cy="665.7" r="5.5" fill="#0e7490"/><circle cx="758.1" cy="608.7" r="5.5" fill="#0e7490"/><circle cx="774.3" cy="537.6" r="5.5" fill="#0e7490"/><text x="840" y="726" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#111827" text-anchor="middle">Chlorine (Cl)</text><text x="840" y="754" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490" text-anchor="middle">17 electrons — 2, 8, 7</text><rect x="1020" y="470" width="280" height="272" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="1160" cy="590" r="20" fill="#1e293b"/><circle cx="1160" cy="590" r="34" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="1160.0" cy="556.0" r="5.5" fill="#0e7490"/><circle cx="1160.0" cy="624.0" r="5.5" fill="#0e7490"/><circle cx="1160" cy="590" r="59" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="1160.0" cy="531.0" r="5.5" fill="#0e7490"/><circle cx="1201.7" cy="548.3" r="5.5" fill="#0e7490"/><circle cx="1219.0" cy="590.0" r="5.5" fill="#0e7490"/><circle cx="1201.7" cy="631.7" r="5.5" fill="#0e7490"/><circle cx="1160.0" cy="649.0" r="5.5" fill="#0e7490"/><circle cx="1118.3" cy="631.7" r="5.5" fill="#0e7490"/><circle cx="1101.0" cy="590.0" r="5.5" fill="#0e7490"/><circle cx="1118.3" cy="548.3" r="5.5" fill="#0e7490"/><circle cx="1160" cy="590" r="84" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="1160.0" cy="506.0" r="5.5" fill="#0e7490"/><circle cx="1219.4" cy="530.6" r="5.5" fill="#0e7490"/><circle cx="1244.0" cy="590.0" r="5.5" fill="#0e7490"/><circle cx="1219.4" cy="649.4" r="5.5" fill="#0e7490"/><circle cx="1160.0" cy="674.0" r="5.5" fill="#0e7490"/><circle cx="1100.6" cy="649.4" r="5.5" fill="#0e7490"/><circle cx="1076.0" cy="590.0" r="5.5" fill="#0e7490"/><circle cx="1100.6" cy="530.6" r="5.5" fill="#0e7490"/><circle cx="1160" cy="590" r="109" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="2.5"/><circle cx="1160.0" cy="481.0" r="5.5" fill="#0e7490"/><circle cx="1160.0" cy="699.0" r="5.5" fill="#0e7490"/><text x="1160" y="726" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#111827" text-anchor="middle">Calcium (Ca)</text><text x="1160" y="754" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="24" fill="#0e7490" text-anchor="middle">20 electrons — 2, 8, 8, 2</text><rect x="60" y="880" width="1480" height="118" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/><text x="88" y="914" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="27" font-weight="800" fill="#111827">Losing or gaining electrons makes an ion</text><text x="88" y="944" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" fill="#475569">Sodium (2, 8, 1) loses its single outer electron and becomes Na⁺ (2, 8).</text><text x="88" y="972" font-family="'Liberation Sans',Arial,Helvetica,sans-serif" font-size="25" fill="#475569">Chlorine (2, 8, 7) gains one and becomes Cl⁻ (2, 8, 8) — both then have a full outer shell.</text></svg>