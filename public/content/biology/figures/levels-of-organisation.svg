<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img"><title>The five levels of organisation from one muscle cell to the human being</title><rect x="0" y="0" width="1000" height="700" fill="#ffffff"/><defs><marker id="levels-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="levels-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker><marker id="levels-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="levels-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><text x="500" y="44" font-family="Helvetica,Arial,sans-serif" font-size="28" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">THE FIVE LEVELS OF ORGANISATION</text><text x="500" y="80" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">from the smallest level to the largest</text><line x1="60" y1="118" x2="930" y2="118" stroke="#475569" stroke-width="3" marker-end="url(#levels-arrow)"/><text x="60" y="146" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">smallest level</text><text x="930" y="146" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="end" fill="#475569" font-weight="400" dominant-baseline="middle">largest level</text><rect x="20" y="168" width="176" height="240" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><rect x="216" y="168" width="176" height="240" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><rect x="412" y="168" width="176" height="240" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><rect x="608" y="168" width="176" height="240" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><rect x="804" y="168" width="176" height="240" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><path d="M 36,288 C 72.0,266 144.0,266 180,288 C 144.0,310 72.0,310 36,288 Z" fill="#fecdd3" stroke="#9f1239" stroke-width="3"/><ellipse cx="108" cy="288" rx="17" ry="12" fill="#ddd6fe" stroke="#6d28d9" stroke-width="3"/><path d="M 234,252 C 269.0,236 339.0,236 374,252 C 339.0,268 269.0,268 234,252 Z" fill="#fecdd3" stroke="#9f1239" stroke-width="3"/><ellipse cx="304" cy="252" rx="13" ry="9" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><path d="M 234,288 C 269.0,272 339.0,272 374,288 C 339.0,304 269.0,304 234,288 Z" fill="#fecdd3" stroke="#9f1239" stroke-width="3"/><ellipse cx="304" cy="288" rx="13" ry="9" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><path d="M 234,324 C 269.0,308 339.0,308 374,324 C 339.0,340 269.0,340 234,324 Z" fill="#fecdd3" stroke="#9f1239" stroke-width="3"/><ellipse cx="304" cy="324" rx="13" ry="9" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2.5"/><path d="M 478,206 C 538,214 556,258 540,294 C 524,328 484,338 456,318 C 486,306 508,288 502,256 C 498,232 484,214 478,206 Z" fill="#fecdd3" stroke="#9f1239" stroke-width="3"/><path d="M 488,220 C 532,232 544,266 530,296" fill="none" stroke="#9f1239" stroke-width="2" stroke-dasharray="7 5"/><circle cx="512" cy="250" r="4" fill="#b45309"/><circle cx="522" cy="270" r="4" fill="#b45309"/><circle cx="516" cy="290" r="4" fill="#b45309"/><path d="M 648,192 C 686,198 700,224 692,248 C 684,270 658,276 640,264 C 658,256 668,244 664,226 C 662,212 652,200 648,192 Z" fill="#fecdd3" stroke="#9f1239" stroke-width="3"/><circle cx="728" cy="212" r="13" fill="#fde68a" stroke="#b45309" stroke-width="3"/><circle cx="744" cy="240" r="10" fill="#fde68a" stroke="#b45309" stroke-width="3"/><path d="M 662,272 C 702,266 734,276 738,296 C 740,316 712,326 680,320 C 648,314 636,300 642,284" fill="none" stroke="#c2410c" stroke-width="11" stroke-linecap="round"/><path d="M 662,272 C 702,266 734,276 738,296 C 740,316 712,326 680,320 C 648,314 636,300 642,284" fill="none" stroke="#fdba74" stroke-width="5" stroke-linecap="round"/><circle cx="892" cy="212" r="21" fill="#fecdd3" stroke="#9f1239" stroke-width="3"/><line x1="892" y1="236" x2="892" y2="316" stroke="#9f1239" stroke-width="8" stroke-linecap="round"/><line x1="892" y1="254" x2="854" y2="296" stroke="#9f1239" stroke-width="7" stroke-linecap="round"/><line x1="892" y1="254" x2="930" y2="296" stroke="#9f1239" stroke-width="7" stroke-linecap="round"/><line x1="892" y1="316" x2="866" y2="374" stroke="#9f1239" stroke-width="7" stroke-linecap="round"/><line x1="892" y1="316" x2="918" y2="374" stroke="#9f1239" stroke-width="7" stroke-linecap="round"/><text x="108" y="434" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">CELL</text><text x="108" y="466" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">one muscle cell</text><text x="304" y="434" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">TISSUE</text><text x="304" y="466" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">muscle tissue,</text><text x="304" y="487" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">many muscle cells</text><text x="304" y="508" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">working together</text><text x="500" y="434" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">ORGAN</text><text x="500" y="466" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">the stomach,</text><text x="500" y="487" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">muscle tissue plus</text><text x="500" y="508" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">lining tissue and</text><text x="500" y="529" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">gland tissue</text><text x="696" y="434" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">ORGAN SYSTEM</text><text x="696" y="466" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">the digestive</text><text x="696" y="487" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">system, the stomach</text><text x="696" y="508" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">plus the intestines</text><text x="696" y="529" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">and the glands that</text><text x="696" y="550" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">feed it</text><text x="892" y="434" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">ORGANISM</text><text x="892" y="466" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">the human being</text><rect x="20" y="596" width="960" height="82" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="500" y="622" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">An organism is not a loose bag of cells: it is five levels of organisation.</text><text x="500" y="652" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">Each level is built from the one before it.</text></svg>