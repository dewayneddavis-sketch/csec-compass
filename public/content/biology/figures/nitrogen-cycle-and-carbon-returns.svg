<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" width="1000" height="1060" role="img"><title>The nitrogen cycle as a closed loop, with the carbon cycle's four returns beside it</title><rect x="0" y="0" width="1000" height="1060" fill="#ffffff"/><defs><marker id="ncycle-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="ncycle-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker><marker id="ncycle-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="ncycle-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><text x="20" y="42" font-family="Helvetica,Arial,sans-serif" font-size="28" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">THE NITROGEN CYCLE</text><text x="20" y="74" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">the air, the soil, the plants and the animals, and back to the air</text><rect x="170" y="90" width="300" height="100" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/><text x="320" y="120" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">nitrogen gas</text><text x="320" y="148" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">most of the air</text><rect x="170" y="230" width="300" height="120" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/><text x="320" y="260" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">nitrogen fixation</text><text x="320" y="288" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">Rhizobium, in the root</text><text x="320" y="307" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">nodules of legumes</text><rect x="170" y="390" width="300" height="80" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/><text x="320" y="420" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">ammonium compounds</text><rect x="170" y="510" width="300" height="120" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/><text x="320" y="540" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">nitrifying bacteria</text><text x="320" y="568" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">nitrites, then nitrates</text><rect x="170" y="670" width="300" height="120" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/><text x="320" y="700" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">assimilation</text><text x="320" y="728" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">nitrates into amino acids</text><text x="320" y="747" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">and proteins, then the</text><text x="320" y="766" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">animals that eat the plant</text><rect x="170" y="830" width="300" height="120" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2.5"/><text x="320" y="860" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">decomposers</text><text x="320" y="888" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">decomposition of dead</text><text x="320" y="907" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">plants, dead animals</text><text x="320" y="926" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">and animal waste</text><line x1="320" y1="190" x2="320" y2="222" stroke="#475569" stroke-width="4" marker-end="url(#ncycle-arrow)"/><line x1="320" y1="350" x2="320" y2="382" stroke="#475569" stroke-width="4" marker-end="url(#ncycle-arrow)"/><line x1="320" y1="470" x2="320" y2="502" stroke="#475569" stroke-width="4" marker-end="url(#ncycle-arrow)"/><line x1="320" y1="630" x2="320" y2="662" stroke="#475569" stroke-width="4" marker-end="url(#ncycle-arrow)"/><line x1="320" y1="790" x2="320" y2="822" stroke="#475569" stroke-width="4" marker-end="url(#ncycle-arrow)"/><path d="M 170,890 L 100,890 L 100,430 L 164,430" fill="none" stroke="#b91c1c" stroke-width="4" marker-end="url(#ncycle-red)"/><text x="76" y="660" transform="rotate(-90 76 660)" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#b91c1c" dominant-baseline="middle">decomposition returns ammonium compounds to the soil</text><rect x="500" y="560" width="140" height="130" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/><text x="570" y="592" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">denitrifying</text><text x="570" y="614" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">bacteria</text><text x="570" y="640" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">change nitrates</text><text x="570" y="658" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">back into</text><text x="570" y="676" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">nitrogen gas</text><line x1="470" y1="575" x2="496" y2="604" stroke="#475569" stroke-width="4" marker-end="url(#ncycle-arrow)"/><path d="M 570,560 L 570,140 L 474,140" fill="none" stroke="#475569" stroke-width="4" marker-end="url(#ncycle-arrow)"/><rect x="660" y="90" width="320" height="600" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="820" y="122" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">the carbon cycle</text><text x="820" y="152" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">matter is recycled</text><rect x="675" y="180" width="290" height="92" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="820" y="212" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">photosynthesis</text><text x="820" y="242" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">removes carbon dioxide</text><rect x="675" y="290" width="290" height="92" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="820" y="322" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">respiration</text><text x="820" y="352" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">returns it</text><rect x="675" y="400" width="290" height="92" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="820" y="432" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">combustion</text><text x="820" y="462" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">returns it</text><rect x="675" y="510" width="290" height="92" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="820" y="542" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">decomposition</text><text x="820" y="572" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">returns it</text><text x="820" y="652" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">Fossil fuels store carbon</text><text x="820" y="672" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">until they are burned</text><rect x="20" y="970" width="960" height="66" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="500" y="1003" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">Energy flows in one direction; matter is recycled.</text></svg>