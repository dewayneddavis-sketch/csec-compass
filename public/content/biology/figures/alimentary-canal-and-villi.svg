<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1130" width="1000" height="1130" role="img"><title>The alimentary canal as a route from the mouth through the oesophagus, the stomach and the coiled small intestine inside the large intestine to the rectum, with the liver, gall bladder and pancreas feeding it and an inset of the villi that absorb the digested food</title><rect x="0" y="0" width="1000" height="1130" fill="#ffffff"/><defs><marker id="gut-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="gut-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker><marker id="gut-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="gut-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><text x="500" y="42" font-family="Helvetica,Arial,sans-serif" font-size="27" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">THE ALIMENTARY CANAL</text><text x="500" y="74" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">the passage of food through the digestive system</text><rect x="20" y="96" width="680" height="784" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><path d="M 240,662 L 240,430 L 470,430 L 470,662" fill="none" stroke="#c2410c" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/><path d="M 240,662 L 240,430 L 470,430 L 470,662" fill="none" stroke="#fdba74" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/><path d="M 470,662 L 470,760" fill="none" stroke="#c2410c" stroke-width="40" stroke-linecap="round"/><path d="M 470,662 L 470,760" fill="none" stroke="#fdba74" stroke-width="30" stroke-linecap="round"/><path d="M 336,390 C 306,418 378,438 408,456 C 438,474 392,492 336,498 C 280,504 274,534 328,544 C 382,554 416,572 378,588 C 340,604 294,612 306,636 C 312,648 268,658 240,662" fill="none" stroke="#fdba74" stroke-width="34" stroke-linecap="round"/><path d="M 336,390 C 306,418 378,438 408,456 C 438,474 392,492 336,498 C 280,504 274,534 328,544 C 382,554 416,572 378,588 C 340,604 294,612 306,636 C 312,648 268,658 240,662" fill="none" stroke="#c2410c" stroke-width="25" stroke-linecap="round"/><rect x="285" y="140" width="100" height="46" rx="12" fill="#fecdd3" stroke="#9f1239" stroke-width="3"/><rect x="320" y="186" width="30" height="84" fill="#fdba74" stroke="#c2410c" stroke-width="3"/><line x1="386" y1="196" x2="386" y2="254" stroke="#475569" stroke-width="4" marker-end="url(#gut-arrow)"/><line x1="288" y1="196" x2="288" y2="254" stroke="#475569" stroke-width="4" marker-end="url(#gut-arrow)"/><path d="M 320,270 C 404,272 450,318 438,362 C 426,404 360,412 320,388 Z" fill="#fecdd3" stroke="#9f1239" stroke-width="3"/><line x1="404" y1="448" x2="418" y2="466" stroke="#475569" stroke-width="3" marker-end="url(#gut-arrow)"/><line x1="292" y1="536" x2="276" y2="552" stroke="#475569" stroke-width="3" marker-end="url(#gut-arrow)"/><line x1="240" y1="560" x2="240" y2="500" stroke="#475569" stroke-width="3" marker-end="url(#gut-arrow)"/><line x1="300" y1="430" x2="360" y2="430" stroke="#475569" stroke-width="3" marker-end="url(#gut-arrow)"/><line x1="470" y1="500" x2="470" y2="570" stroke="#475569" stroke-width="3" marker-end="url(#gut-arrow)"/><line x1="506" y1="700" x2="506" y2="744" stroke="#475569" stroke-width="3" marker-end="url(#gut-arrow)"/><path d="M 500,300 C 566,286 616,308 622,344 C 626,376 584,392 534,384 C 506,378 494,330 500,300 Z" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/><ellipse cx="516" cy="412" rx="24" ry="15" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/><path d="M 540,470 C 596,458 646,474 654,500 C 660,526 610,534 560,526 C 538,522 534,486 540,470 Z" fill="#fde68a" stroke="#b45309" stroke-width="3"/><line x1="532" y1="422" x2="446" y2="470" stroke="#15803d" stroke-width="3" marker-end="url(#gut-arrow)"/><text x="556" y="436" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#15803d" font-weight="400" dominant-baseline="middle">bile</text><text x="60" y="166" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">mouth</text><line x1="121" y1="166" x2="283" y2="163" stroke="#64748b" stroke-width="2"/><circle cx="283" cy="163" r="4.5" fill="#64748b"/><text x="60" y="196" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">the teeth grind the food</text><text x="60" y="240" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">oesophagus</text><line x1="172" y1="240" x2="318" y2="240" stroke="#64748b" stroke-width="2"/><circle cx="318" cy="240" r="4.5" fill="#64748b"/><text x="410" y="150" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">peristalsis</text><line x1="402" y1="150" x2="386" y2="200" stroke="#64748b" stroke-width="2"/><circle cx="386" cy="200" r="4.5" fill="#64748b"/><text x="60" y="330" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">stomach</text><line x1="140" y1="330" x2="326" y2="330" stroke="#64748b" stroke-width="2"/><circle cx="326" cy="330" r="4.5" fill="#64748b"/><text x="60" y="560" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">small intestine</text><line x1="188" y1="560" x2="300" y2="552" stroke="#64748b" stroke-width="2"/><circle cx="300" cy="552" r="4.5" fill="#64748b"/><text x="60" y="762" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">rectum</text><line x1="126" y1="762" x2="455" y2="762" stroke="#64748b" stroke-width="2"/><circle cx="455" cy="762" r="4.5" fill="#64748b"/><text x="60" y="792" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">faeces stored in the rectum before being egested</text><text x="520" y="690" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">large intestine</text><line x1="512" y1="690" x2="474" y2="690" stroke="#64748b" stroke-width="2"/><circle cx="474" cy="690" r="4.5" fill="#64748b"/><text x="630" y="330" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">liver</text><line x1="622" y1="330" x2="620" y2="336" stroke="#64748b" stroke-width="2"/><circle cx="620" cy="336" r="4.5" fill="#64748b"/><text x="630" y="400" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">gall</text><text x="630" y="423" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">bladder</text><line x1="622" y1="400" x2="542" y2="412" stroke="#64748b" stroke-width="2"/><circle cx="542" cy="412" r="4.5" fill="#64748b"/><text x="694" y="556" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="end" fill="#0f172a" font-weight="400" dominant-baseline="middle">pancreas</text><line x1="640" y1="537" x2="640" y2="528" stroke="#64748b" stroke-width="2"/><circle cx="640" cy="528" r="4.5" fill="#64748b"/><rect x="720" y="96" width="260" height="784" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="850" y="132" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">VILLI</text><text x="850" y="160" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">in the wall of the small intestine</text><rect x="736" y="600" width="228" height="16" fill="#fde68a" stroke="#b45309" stroke-width="2"/><path d="M 764,600 L 764,340 C 764,316 808,316 808,340 L 808,600 Z" fill="#fecdd3" stroke="#9f1239" stroke-width="3"/><path d="M 777,596 L 777,348" stroke="#b91c1c" stroke-width="6" stroke-linecap="round"/><path d="M 795,348 L 795,596" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/><path d="M 828,600 L 828,340 C 828,316 872,316 872,340 L 872,600 Z" fill="#fecdd3" stroke="#9f1239" stroke-width="3"/><path d="M 841,596 L 841,348" stroke="#b91c1c" stroke-width="6" stroke-linecap="round"/><path d="M 859,348 L 859,596" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/><path d="M 892,600 L 892,340 C 892,316 936,316 936,340 L 936,600 Z" fill="#fecdd3" stroke="#9f1239" stroke-width="3"/><path d="M 905,596 L 905,348" stroke="#b91c1c" stroke-width="6" stroke-linecap="round"/><path d="M 923,348 L 923,596" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round"/><text x="734" y="250" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">finger-like projections</text><line x1="786" y1="267" x2="786" y2="336" stroke="#64748b" stroke-width="2"/><circle cx="786" cy="336" r="4.5" fill="#64748b"/><text x="850" y="660" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">a very large surface area</text><text x="850" y="700" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="400" dominant-baseline="middle">a rich blood supply</text><line x1="921" y1="700" x2="970" y2="700" stroke="#64748b" stroke-width="2"/><line x1="970" y1="700" x2="970" y2="300" stroke="#64748b" stroke-width="2"/><line x1="970" y1="300" x2="818" y2="300" stroke="#64748b" stroke-width="2"/><line x1="818" y1="300" x2="818" y2="480" stroke="#64748b" stroke-width="2"/><line x1="818" y1="480" x2="841" y2="480" stroke="#64748b" stroke-width="2"/><circle cx="841" cy="480" r="4.5" fill="#64748b"/><text x="850" y="730" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">absorbed into the blood</text><text x="850" y="780" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">The digested nutrients are</text><text x="850" y="799" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">absorbed through the villi,</text><text x="850" y="818" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">finger-like projections of</text><text x="850" y="837" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">the wall of the small intestine.</text><rect x="20" y="904" width="960" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="940" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">Each enzyme digests one type of food: amylase breaks starch down to maltose, protease breaks proteins</text><text x="40" y="974" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">down to amino acids, and lipase breaks fats down to fatty acids and glycerol.</text><text x="40" y="1018" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">The liver produces bile, stored in the gall bladder, released into the small intestine,</text><text x="40" y="1052" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">where it emulsifies fats into small droplets so that there is a larger surface area for lipase to act on.</text></svg>