<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 940" width="1000" height="940" role="img"><title>A bean seed in longitudinal section with the testa round the outside, the two cotyledons, the radicle and the plumule, beside the same seed germinating with the radicle growing down and the plumule up</title><rect x="0" y="0" width="1000" height="940" fill="#ffffff"/><defs><marker id="seed-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="seed-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker><marker id="seed-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="seed-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><text x="500" y="42" font-family="Helvetica,Arial,sans-serif" font-size="27" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">A BEAN SEED, AND GERMINATION</text><rect x="20" y="80" width="470" height="620" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="255" y="116" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">longitudinal section</text><ellipse cx="245" cy="400" rx="115" ry="145" fill="#fef3c7" stroke="#b45309" stroke-width="5"/><path d="M 233,262 C 172,272 140,330 140,400 C 140,470 174,528 233,538 Z" fill="#fde68a" stroke="#b45309" stroke-width="3"/><path d="M 257,262 C 318,272 350,330 350,400 C 350,470 316,528 257,538 Z" fill="#fde68a" stroke="#b45309" stroke-width="3"/><path d="M 238,516 L 262,516 L 250,566 Z" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><path d="M 250,502 C 232,484 232,462 250,450 C 268,462 268,484 250,502 Z" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/><path d="M 250,488 C 238,474 238,458 250,448 C 262,458 262,474 250,488 Z" fill="none" stroke="#15803d" stroke-width="2"/><text x="30" y="148" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">testa</text><line x1="36" y1="148" x2="168" y2="288" stroke="#64748b" stroke-width="2"/><circle cx="168" cy="288" r="4.5" fill="#64748b"/><text x="30" y="176" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">the tough outer seed coat</text><text x="30" y="400" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">cotyledons</text><line x1="36" y1="400" x2="138" y2="400" stroke="#64748b" stroke-width="2"/><circle cx="138" cy="400" r="4.5" fill="#64748b"/><text x="364" y="330" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">plumule</text><line x1="370" y1="330" x2="264" y2="482" stroke="#64748b" stroke-width="2"/><circle cx="264" cy="482" r="4.5" fill="#64748b"/><text x="364" y="356" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">the young shoot</text><text x="364" y="560" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">radicle</text><line x1="370" y1="560" x2="262" y2="546" stroke="#64748b" stroke-width="2"/><circle cx="262" cy="546" r="4.5" fill="#64748b"/><text x="364" y="586" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">the young root</text><text x="245" y="626" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">The plumule is the tiny shoot with its</text><text x="245" y="645" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">first leaves folded inside it.</text><rect x="510" y="80" width="470" height="620" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="745" y="116" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">germination</text><rect x="520" y="560" width="450" height="130" fill="#e7e5e4"/><line x1="520" y1="560" x2="970" y2="560" stroke="#78716c" stroke-width="3"/><path d="M 676,510 C 676,452 824,452 824,510 C 824,544 676,544 676,510 Z" fill="#fde68a" stroke="#b45309" stroke-width="4"/><path d="M 750,456 L 750,536" stroke="#b45309" stroke-width="2.5" stroke-dasharray="7 5"/><path d="M 750,540 C 746,584 754,614 764,644" fill="none" stroke="#b91c1c" stroke-width="9" stroke-linecap="round"/><path d="M 750,452 C 750,412 752,388 754,362" fill="none" stroke="#15803d" stroke-width="8" stroke-linecap="round"/><path d="M 754,362 C 726,344 704,362 704,384 C 730,392 750,384 754,362 Z" fill="#bbf7d0" stroke="#15803d" stroke-width="2.5"/><path d="M 754,362 C 782,344 804,362 804,384 C 778,392 758,384 754,362 Z" fill="#bbf7d0" stroke="#15803d" stroke-width="2.5"/><line x1="800" y1="448" x2="800" y2="380" stroke="#15803d" stroke-width="4" marker-end="url(#seed-arrow)"/><line x1="800" y1="546" x2="800" y2="620" stroke="#475569" stroke-width="4" marker-end="url(#seed-arrow)"/><text x="560" y="262" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">the plumule grows upwards</text><text x="560" y="480" font-family="Helvetica,Arial,sans-serif" font-size="16" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">cotyledons</text><line x1="566" y1="480" x2="676" y2="486" stroke="#64748b" stroke-width="2"/><circle cx="676" cy="486" r="4.5" fill="#64748b"/><text x="560" y="676" font-family="Helvetica,Arial,sans-serif" font-size="15" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">the radicle grows downwards into the soil</text><rect x="20" y="726" width="960" height="190" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="762" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">Germination needs water, oxygen and a suitable temperature, and each one has a job:</text><text x="40" y="796" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">water softens the testa and activates the enzymes, oxygen is needed because the seed respires,</text><text x="40" y="830" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">and warmth makes the enzymes work faster.</text><text x="40" y="872" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#b91c1c" font-weight="400" dominant-baseline="middle">Light is not one of the three: a bean seed will germinate in the dark.</text><text x="40" y="906" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">A seed with two cotyledons is described as dicotyledonous.</text></svg>