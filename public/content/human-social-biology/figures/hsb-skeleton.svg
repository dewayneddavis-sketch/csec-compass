ke-linecap="round"/><path d="M 312,912 C 316,984 318,1030 320,1076" fill="none" stroke="#4338ca" stroke-width="22" stroke-linecap="round"/><path d="M 312,912 C 316,984 318,1030 320,1076" fill="none" stroke="#a5b4fc" stroke-width="13" stroke-linecap="round"/><path d="M 292,1076 L 338,1076 L 344,1104 L 288,1104 Z" fill="#e0e7ff" stroke="#4338ca" stroke-width="4"/><circle cx="270" cy="180" r="19" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><text x="270" y="181" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">1</text><circle cx="270" cy="430" r="19" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><text x="270" y="431" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">2</text><circle cx="210" cy="400" r="19" fill="#ffffff" stroke="#475569" stroke-width="3"/><text x="210" y="401" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">3</text><circle cx="122" cy="470" r="19" fill="#ffffff" stroke="#4338ca" stroke-width="3"/><text x="122" y="471" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">4</text><circle cx="270" cy="628" r="19" fill="#ffffff" stroke="#4338ca" stroke-width="3"/><text x="270" y="629" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">5</text><rect x="500" y="110" width="480" height="600" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="524" y="148" font-family="Helvetica,Arial,sans-serif" font-size="24" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">KEY</text><circle cx="548" cy="202" r="17" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><text x="548" y="203" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">1</text><text x="586" y="188" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">skull</text><text x="586" y="218" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">axial · protects the brain</text><circle cx="548" cy="302" r="17" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><text x="548" y="303" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">2</text><text x="586" y="288" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">vertebral column</text><text x="586" y="318" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">axial · part of the framework</text><circle cx="548" cy="402" r="17" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><text x="548" y="403" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">3</text><text x="586" y="388" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">rib cage</text><text x="586" y="418" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">axial · protects the heart and lungs</text><circle cx="548" cy="502" r="17" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><text x="548" y="503" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">4</text><text x="586" y="488" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">limbs (arms and legs)</text><text x="586" y="518" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">appendicular · movement</text><circle cx="548" cy="602" r="17" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><text x="548" y="603" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">5</text><text x="586" y="588" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">girdles (shoulder and hip)</text><text x="586" y="618" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">appendicular · with the limbs</text><text x="524" y="668" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">Bones also store the minerals calcium and</text><text x="524" y="694" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">phosphorus; the marrow makes blood cells.</text><rect x="500" y="730" width="480" height="350" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/><text x="524" y="770" font-family="Helvetica,Arial,sans-serif" font-size="21" text-anchor="start" fill="#92400e" font-weight="700" dominant-baseline="middle">BONE MARROW — INSIDE A LONG BONE</text><path d="M 620,806 C 588,830 588,872 620,896 L 620,1040 C 588,1064 588,1100 622,1112 C 660,1124 686,1100 686,1054 L 686,846 C 686,806 664,788 640,792 Z" fill="#f8fafc" stroke="#475569" stroke-width="5"/><path d="M 634,812 C 616,830 616,868 634,890 L 634,1040 C 618,1060 618,1088 640,1098 C 660,1104 672,1090 672,1056 L 672,852 C 672,826 662,808 648,810 Z" fill="#fde68a" stroke="#b45309" stroke-width="3"/><circle cx="712" cy="950" r="17" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><text x="712" y="951" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">6</text><text x="742" y="936" font-family="Helvetica,Arial,sans-serif" font-size="22" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">bone marrow</text><text x="742" y="966" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="start" fill="#475569" font-weight="400" dominant-baseline="middle">makes blood cells</text><line x1="590" y1="908" x2="618" y2="902" stroke="#475569" stroke-width="2"/><circle cx="618" cy="902" r="4.5" fill="#475569"/><text x="586" y="902" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="end" fill="#475569" font-weight="400" dominant-baseline="middle">bone — stores calcium</text><text x="586" y="928" font-family="Helvetica,Arial,sans-serif" font-size="19" text-anchor="end" fill="#475569" font-weight="400" dominant-baseline="middle">and phosphorus</text><rect x="20" y="1120" width="960" height="66" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="44" y="1153" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="start" fill="#0f172a" font-weight="400" dominant-baseline="middle">The axial skeleton supports and protects; the appendicular skeleton moves the body.</text></svg>