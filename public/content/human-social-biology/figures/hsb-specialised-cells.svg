<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img"><title>Diagrams of red blood, sperm and nerve cells with their adaptations, above the levels of organisation from cells to systems</title><rect x="0" y="0" width="1000" height="760" fill="#ffffff"/><defs><marker id="cells-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker><marker id="cells-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker><marker id="cells-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/></marker><marker id="cells-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/></marker></defs><text x="20" y="42" font-family="Helvetica,Arial,sans-serif" font-size="28" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">SPECIALISED CELLS AND THE LEVELS OF ORGANISATION</text><rect x="20" y="68" width="290" height="372" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="165" y="104" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">RED BLOOD CELL</text><ellipse cx="165" cy="230" rx="104" ry="78" fill="#fca5a5" stroke="#b91c1c" stroke-width="5"/><ellipse cx="165" cy="230" rx="62" ry="44" fill="#fecaca" stroke="none"/><circle cx="165" cy="230" r="26" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 6"/><text x="165" y="232" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#b91c1c" font-weight="400" dominant-baseline="middle">no</text><text x="165" y="252" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#b91c1c" font-weight="400" dominant-baseline="middle">nucleus</text><text x="165" y="348" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">disc-shaped</text><text x="165" y="376" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">carries oxygen</text><text x="165" y="402" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">for the whole body</text><rect x="355" y="68" width="290" height="372" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="500" y="104" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">SPERM CELL</text><ellipse cx="440" cy="222" rx="62" ry="46" fill="#ddd6fe" stroke="#6d28d9" stroke-width="5"/><path d="M 500,222 C 556,180 566,266 610,224 C 646,192 664,254 620,268" fill="none" stroke="#6d28d9" stroke-width="9" stroke-linecap="round"/><text x="455" y="348" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">a tail for swimming</text><text x="455" y="376" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">to reach the egg</text><rect x="690" y="68" width="290" height="372" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="835" y="104" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">NERVE CELL</text><circle cx="752" cy="200" r="34" fill="#e9d5ff" stroke="#7e22ce" stroke-width="5"/><line x1="737.0" y1="185.0" x2="722" y2="170" stroke="#7e22ce" stroke-width="6" stroke-linecap="round"/><line x1="752.0" y1="180.0" x2="752" y2="160" stroke="#7e22ce" stroke-width="6" stroke-linecap="round"/><line x1="767.0" y1="186.0" x2="782" y2="172" stroke="#7e22ce" stroke-width="6" stroke-linecap="round"/><line x1="735.0" y1="211.0" x2="718" y2="222" stroke="#7e22ce" stroke-width="6" stroke-linecap="round"/><line x1="768.0" y1="213.0" x2="784" y2="226" stroke="#7e22ce" stroke-width="6" stroke-linecap="round"/><path d="M 786,200 L 930,206" fill="none" stroke="#7e22ce" stroke-width="15" stroke-linecap="round"/><path d="M 786,200 L 930,206" fill="none" stroke="#d8b4fe" stroke-width="6" stroke-linecap="round"/><text x="846" y="348" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">long and thin</text><text x="846" y="376" font-family="Helvetica,Arial,sans-serif" font-size="20" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">carries electrical signals</text><rect x="20" y="462" width="960" height="268" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="44" y="496" font-family="Helvetica,Arial,sans-serif" font-size="23" text-anchor="start" fill="#0f172a" font-weight="700" dominant-baseline="middle">FROM CELLS TO SYSTEMS</text><rect x="60" y="528" width="190" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="155" y="574" font-family="Helvetica,Arial,sans-serif" font-size="24" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">CELLS</text><text x="155" y="612" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">the basic unit</text><text x="155" y="636" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">of life</text><line x1="256" y1="603" x2="288" y2="603" stroke="#0f172a" stroke-width="5" marker-end="url(#cells-arrow)"/><rect x="300" y="528" width="190" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="395" y="574" font-family="Helvetica,Arial,sans-serif" font-size="24" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">TISSUES</text><text x="395" y="612" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">groups of similar</text><text x="395" y="636" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">cells</text><line x1="496" y1="603" x2="528" y2="603" stroke="#0f172a" stroke-width="5" marker-end="url(#cells-arrow)"/><rect x="540" y="528" width="190" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="635" y="574" font-family="Helvetica,Arial,sans-serif" font-size="24" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">ORGANS</text><text x="635" y="612" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">different tissues working</text><text x="635" y="636" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">together</text><line x1="736" y1="603" x2="768" y2="603" stroke="#0f172a" stroke-width="5" marker-end="url(#cells-arrow)"/><rect x="780" y="528" width="190" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="875" y="574" font-family="Helvetica,Arial,sans-serif" font-size="24" text-anchor="middle" fill="#0f172a" font-weight="700" dominant-baseline="middle">SYSTEMS</text><text x="875" y="612" font-family="Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle" fill="#475569" font-weight="400" dominant-baseline="middle">organs working together</text></svg>